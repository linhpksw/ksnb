/* ---------- Rules Kiểm soát Nội bộ theo QĐ 176/2024/QĐ-HNT (Gia hạn HĐ Phòng Dự án) ---------- */
Rl('qd176_not_3yr','discounts','HĐ gia hạn hưởng CK QĐ 176 nhưng chưa đủ điều kiện đã ký ≥ 3 năm','Gia hạn < 3 năm hưởng CK','r',r=>{
  if(r.termCase!=='renew_qd176'&&r.termCase!=='extension')return false;
  if(r.exception==='y'||!isNum(r.amount)||N(r.amount)<=0)return false;
  const c=ctr(r.contractId);
  const hist=c?custContractHistory(c.customerId):null;
  const db3yr=hist&&hist.isGe3Years;
  const manual3yr=r.isPrior3Years==='yes_manual'||r.isPrior3Years==='auto'||(c&&isNum(c.priorYears)&&N(c.priorYears)>=3);
  return !db3yr&&!manual3yr;
},{dash:1});

Rl('qd176_manual_no_proof','discounts','Xác nhận thủ công thâm niên ≥ 3 năm nhưng thiếu căn cứ HĐ cũ/ngày ký gốc (QĐ 176)','Thiếu căn cứ HĐ cũ','y',r=>{
  if(r.termCase!=='renew_qd176'&&r.termCase!=='extension')return false;
  if(!isNum(r.amount)||N(r.amount)<=0||r.exception==='y')return false;
  return r.isPrior3Years==='yes_manual'&&!r.priorProof;
},{dash:1});

Rl('qd176_under_6m','discounts','HĐ gia hạn dưới 6 tháng hưởng chiết khấu chưa có phê duyệt ngoại lệ (QĐ 176)','Gia hạn < 6th hưởng CK','r',r=>{
  if(r.termCase!=='renew_qd176'&&r.termCase!=='extension')return false;
  if(!isNum(r.amount)||N(r.amount)<=0||r.exception==='y')return false;
  const c=ctr(r.contractId);
  const m=isNum(r.renewMonths)?N(r.renewMonths):(c?ctrDurationMonths(c):null);
  return m!=null&&m<6;
},{dash:1});

Rl('qd176_rate_over','discounts','Tỷ lệ chiết khấu gia hạn vượt khung tối đa QĐ 176 (10% / 20% / 30%)','CK gia hạn vượt trần','r',r=>{
  if(r.termCase!=='renew_qd176'&&r.termCase!=='extension')return false;
  if(!isNum(r.actualRate)||r.exception==='y')return false;
  const c=ctr(r.contractId);
  const m=isNum(r.renewMonths)?N(r.renewMonths):(c?ctrDurationMonths(c):null);

Rl('qd176_base_mismatch','discounts','Doanh thu tính chiết khấu gia hạn khác doanh thu thuê kho bãi 1 tháng (QĐ 176)','DT tính CK ≠ 1th kho bãi','y',r=>{
  if(r.termCase!=='renew_qd176'&&r.termCase!=='extension')return false;

Rl('qd176_auth_missing','discounts','Chiết khấu gia hạn thiếu đề xuất của GĐĐH hoặc chưa được HĐQT thông qua (QĐ 176)','Thiếu duyệt GĐĐH/HĐQT','r',r=>{
  if(r.termCase!=='renew_qd176'&&r.termCase!=='extension')return false;
  if(!isNum(r.amount)||N(r.amount)<=0||r.exception==='y')return false;
  return r.gddhProposed!=='y'||r.hdqtApproved!=='y';
},{dash:1});

Rl('qd176_clawback_missing','discounts','Khách chủ động chấm dứt HĐ gia hạn trước hạn: chưa truy thu hoặc thu thiếu CK (QĐ 176)','Chưa truy thu CK trước hạn','r',r=>{
  const isQd176=r.termCase==='renew_qd176'||r.termCase==='extension';
  const c=ctr(r.contractId);
  const isClientEarly=r.earlyTermBy==='client'||r.termCase==='early_client'||(c&&c.earlyTermination==='client');
  if(!isQd176||!isClientEarly||r.exception==='y')return false;
  if(!isNum(r.actualMonthsUsed))return true;
  const rent=isNum(r.oneMonthRentBase)?N(r.oneMonthRentBase):(isNum(r.related)?N(r.related):0);
  const reqClawback=calcQd176Clawback(r.actualRate,rent,r.actualMonthsUsed);
  return reqClawback>0&&(!isNum(r.clawbackAmt)||N(r.clawbackAmt)<reqClawback);
},{dash:1});

function ruleRows(rule){
  const ent=ENT[rule.ent];let a=DB.all(ent.store);
  if(ent.period&&!rule.all){const P=curPeriod();a=P?a.filter(r=>r.periodId===P.id):[]}
  const c=ctx();return a.filter(r=>safe(()=>rule.test(r,c)));
}

/* ---------- Tiếp nhận follow-up từ kỳ trước ---------- */
async function syncFollowups(pid){
  const P=pid?DB.get('periods',pid):curPeriod();if(!P||P.status==='done')return 0;
  const pi=pIdx(P),have=new Set(DB.all('followups').filter(x=>x.periodId===P.id).map(x=>x.recId)),add=[];
  DB.all('recs').forEach(r=>{
    if(r.status==='closed'||have.has(r.id))return;
    const f=DB.get('findings',r.findingId),fp=f&&DB.get('periods',f.periodId);if(!fp||pIdx(fp)>=pi)return;
    add.push({id:uid(),periodId:P.id,recId:r.id,prevStatus:r.status,curStatus:r.status,newEvidence:'',confirmed:'',confirmDate:'',confirmBy:'',ktksNote:'',createdAt:new Date().toISOString()});
  });
  if(add.length)await DB.putMany('followups',add);
  return add.length;
}
ACT['fu-sync']=async()=>{const n=await syncFollowups();toast(n?`Đã bổ sung ${n} tồn tại từ kỳ trước`:'Không có tồn tại mới cần chuyển sang kỳ này');renderMain()};
ACT['renew-auto']=async()=>{
  const P=curPeriod();if(!P)return;if(P.status==='done'){toast('Kỳ đã hoàn thành','warn');return}
  const have=new Set(DB.all('renewals').filter(x=>x.periodId===P.id).map(x=>x.contractId)),add=[];
  DB.all('contracts').forEach(c=>{const d=daysLeft(c);if(c.status!=='active'||d==null||d>S('expiryDays')||have.has(c.id))return;
    add.push({id:uid(),periodId:P.id,contractId:c.id,startNego:'',owner:'',curPrice:ctrPrice(c)||'',upRate:c.upRate||'',actPrice:'',newSign:'',status:'notstart',reason:'',note:'',createdAt:new Date().toISOString()})});
  if(add.length){await DB.putMany('renewals',add);await logAct('Tạo mới','Theo dõi tái tục',`Tự tạo ${add.length} bản ghi tái tục từ hợp đồng sắp/đã hết hạn`)}
  toast(add.length?`Đã tạo ${add.length} bản ghi tái tục`:'Không có hợp đồng mới cần theo dõi');renderMain();
};

  h+=`<div class="card"><h3>${ic('alert')} Cảnh báo tự động <span class="note" style="font-weight:400">– chỉ là dấu hiệu cần xem xét, KTKS quyết định kết luận</span></h3>${al.map(({x,n})=>`<div class="alrow ${n?'':'zero'}" data-act="go" data-go="${x.ent}" data-f="rule=${x.id}"><span class="n ${n?x.tone:'z'}">${n}</span><span class="sp">${esc(x.label)}</span><span class="note">${ENT[x.ent].title}</span></div>`).join('')}</div>`;
  return h;
}};

function groupRows(chk){

/* ---------- Báo cáo quý ---------- */
function reportData(P){
  const by=s=>DB.all(s).filter(x=>x.periodId===P.id),fnd=by('findings').sort((a,b)=>String(a.code).localeCompare(b.code));
  return{P,chk:by('checklist').sort((a,b)=>String(a.code).localeCompare(b.code,'vi',{numeric:true})),fnd,recs:DB.all('recs').filter(r=>fnd.some(f=>f.id===r.findingId)).sort((a,b)=>String(a.code).localeCompare(b.code)),docs:by('docreqs').sort((a,b)=>(a.stt||0)-(b.stt||0)),fu:by('followups'),inv:by('investments'),pc:by('progcosts'),pay:by('payments'),prices:by('prices'),ren:by('renewals'),disc:by('discounts'),comm:by('commissions'),kpis:by('kpis'),tasks:by('tasks')};
}
const rt=(head,rows,num=[])=>`<table><thead><tr>${head.map((x,i)=>`<th class="${num.includes(i)?'n':''}">${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${num.includes(i)?'n':''}">${c==null?'':c}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${head.length}"><i>Không có dữ liệu</i></td></tr>`}</tbody></table>`;
const nl=s=>esc(s||'').replace(/\n/g,'<br>');
function buildReport(P){
  const D=reportData(P),chk=D.chk,cnt=k=>chk.filter(x=>x.result===k).length,checked=chk.length-cnt('todo'),objOf=f=>[projCode(f.projectId),ctrNo(f.contractId)].filter(Boolean).join(' / ')||'—';
  let h=`<div class="report-doc" id="reportDoc"><h1>Báo cáo kiểm tra kiểm soát nội bộ<br>Phòng Dự án – ${pLabel(P)}</h1><div class="sub">Ngày lập báo cáo: ${fmtDate(todayStr())}</div>`;
  h+=`<h2>1. Thông tin chung</h2>`+rt(['Nội dung','Thông tin'],[['Kỳ kiểm tra',`${pLabel(P)} (${esc(catName('periodStatus',P.status))})`],['Thời gian kiểm tra',`${fmtDate(P.start)} – ${fmtDate(P.end)}`],['Người kiểm tra',esc(catName('person',P.inspector))],['Trưởng/phụ trách Phòng Dự án',esc(catName('person',P.head))],['Ghi chú',nl(P.note)]]);
  h+=`<h2>2. Mục tiêu và phạm vi kiểm tra</h2><p><b>Mục tiêu:</b> ${nl(P.objective)||'—'}</p><p><b>Phạm vi:</b> ${nl(P.scope)||'—'}</p>`;
  const dsc=catItems('docStatus').map(i=>[esc(i.name),D.docs.filter(d=>d.status===i.key).length]);
  h+=`<h2>3. Hồ sơ đã kiểm tra</h2><p>Số lượng bản ghi đã đưa vào kiểm tra trong kỳ: `+[['Quyết định đầu tư',D.inv],['Tiến độ & chi phí dự án',D.pc],['Đợt thanh toán',D.pay],['Kiểm tra giá',D.prices],['Tái tục',D.ren],['Chiết khấu',D.disc],['Hoa hồng KH mới',D.comm],['KPI',D.kpis],['Nhiệm vụ',D.tasks]].map(([l,a])=>`${l}: <b>${a.length}</b>`).join('; ')+`.</p>`+
   rt(['Trạng thái hồ sơ yêu cầu','Số lượng'],dsc,[1])+rt(['STT','Nhóm','Tên hồ sơ','Deadline','Ngày nhận','Người cung cấp','Trạng thái'],D.docs.map(d=>[d.stt,esc(catName('docGroup',d.group)),esc(d.name),fmtDate(d.deadline),fmtDate(d.recvDate),esc(catName('person',d.provider)),esc(catName('docStatus',d.status))]),[0]);
  h+=`<h2>4. Kết quả kiểm tra</h2>`+rt(['Nhóm nội dung','Tổng','Đạt','Có lưu ý','Không đạt','N/A','Chưa KT'],groupRows(chk).concat([['Tổng cộng',chk.length,cnt('pass'),cnt('warn'),cnt('fail'),cnt('na'),cnt('todo')]]).map((r,i,a)=>i===a.length-1?r.map(x=>`<b>${esc(x)}</b>`):r.map(esc)),[1,2,3,4,5,6]);
  const al=RULES.filter(x=>x.dash).map(x=>[x,ruleRows(x).length]).filter(a=>a[1]>0);
  h+=`<p><b>Cảnh báo tự động ghi nhận trong kỳ</b> (dấu hiệu cần xem xét, chưa phải kết luận vi phạm):</p>`+rt(['Cảnh báo','Số lượng'],al.map(([x,n])=>[esc(x.label),n]),[1]);
  h+=`<h2>5. Thống kê Đạt / Có lưu ý / Không đạt</h2><p>Đã kiểm tra <b>${checked}/${chk.length}</b> tiêu chí (${pcOf(checked,chk.length)}%). Trong số đã kiểm tra: Đạt <b>${cnt('pass')}</b> (${pcOf(cnt('pass'),checked)}%), Có lưu ý <b>${cnt('warn')}</b> (${pcOf(cnt('warn'),checked)}%), Không đạt <b>${cnt('fail')}</b> (${pcOf(cnt('fail'),checked)}%), N/A <b>${cnt('na')}</b>.</p>`;
  h+=`<h2>6. Các Finding</h2>`+rt(['Mã','Nhóm','Đối tượng','Nội dung phát hiện','Mức rủi ro','Giá trị (VND)','Kết luận KTKS'],D.fnd.map(f=>[`<b>${esc(f.code)}</b>`,esc(catName('chkGroup',f.group)),esc(objOf(f)),`${nl(f.content)}${f.basis?`<br><i>Căn cứ:</i> ${nl(f.basis)}`:''}${f.actual?`<br><i>Thực trạng:</i> ${nl(f.actual)}`:''}${f.cause?`<br><i>Nguyên nhân:</i> ${nl(f.cause)}`:''}`,`<span class="rb">${esc(catName('riskLevel',f.riskLevel))}</span>`,fmtMoney(f.amount),nl(f.conclusion)]),[5]);
  h+=`<h2>7. Phân loại rủi ro</h2>`+rt(['Mức rủi ro','Số Finding','Giá trị tiền liên quan (VND)'],catItems('riskLevel').map(i=>{const a=D.fnd.filter(f=>f.riskLevel===i.key);return[esc(i.name),a.length,fmtMoney(sumBy(a,f=>f.amount))||'0']}).concat([[`<b>Tổng</b>`,`<b>${D.fnd.length}</b>`,`<b>${fmtMoney(sumBy(D.fnd,f=>f.amount))||'0'}</b>`]]),[1,2]);
  h+=`<h2>8. Kiến nghị</h2>`+rt(['Mã','Finding','Nội dung kiến nghị','Đơn vị / người chịu trách nhiệm','Deadline','Trạng thái'],D.recs.map(r=>[esc(r.code),esc((DB.get('findings',r.findingId)||{}).code),nl(r.content),esc(catName('unit',r.unit)+(r.owner?' / '+catName('person',r.owner):'')),fmtDate(r.deadline),esc(catName('recStatus',recEff(r)))]));
  const rs=catItems('recStatus').map(i=>[esc(i.name),D.recs.filter(r=>recEff(r)===i.key).length]);
  h+=`<h2>9. Tình trạng khắc phục</h2>`+rt(['Trạng thái kiến nghị (thực tế theo hạn)','Số lượng'],rs,[1])+`<p>Tỷ lệ kiến nghị đã đóng: <b>${pcOf(D.recs.filter(r=>r.status==='closed').length,D.recs.length)}%</b> (${D.recs.filter(r=>r.status==='closed').length}/${D.recs.length}). Kiến nghị quá hạn: <b>${D.recs.filter(r=>recEff(r)==='overdue').length}</b>.</p>`;
  h+=`<h2>10. Follow-up tồn tại kỳ trước</h2>`+rt(['Mã Finding','Kỳ phát hiện','Nội dung','Deadline','Tình trạng hiện tại','KTKS xác nhận','Ngày quá hạn'],D.fu.map(r=>{const rc=DB.get('recs',r.recId)||{},f=DB.get('findings',rc.findingId)||{};return[esc(f.code),esc(pLabel(DB.get('periods',f.periodId))),nl(rc.content),fmtDate(rc.deadline),esc(catName('recStatus',recEff(rc))),esc(YN[r.confirmed]||''),recOverdueDays(rc)||'']}),[6]);
  h+=`<h2>11. Kết luận của KTKS</h2><p>${nl(P.conclusion)||'<i>(Chưa có kết luận – nhập ở ô “Kết luận KTKS” phía trên báo cáo)</i>'}</p><div class="sig"><div><b>Người lập báo cáo</b><br><i>(Ký, ghi rõ họ tên)</i><br><br><br>${esc(catName('person',P.inspector))}</div><div><b>Trưởng/phụ trách Phòng Dự án</b><br><i>(Xác nhận đã nhận báo cáo)</i><br><br><br>${esc(catName('person',P.head))}</div></div></div>`;
  return h;
}

const sheetOf=(name,ent,rows)=>{const fs=ent.fields.filter(f=>f.t!=='info');return{name,head:fs.map(f=>f.l),rows:rows.map(r=>fs.map(f=>exportVal(f,r)))}};
const RULE_TONE={r:'Nghiêm trọng',y:'Cần chú ý',b:'Thông tin'};
function ruleRowsAll(rule){const ent=ENT[rule.ent];const c=ctx();return DB.all(ent.store).filter(r=>safe(()=>rule.test(r,c)))}
const RECON_ORDER=['customers','contracts','rentals','services','pricepolicies','policytiers','prices','discounts','commissions','renewals','revenues','projects','investments','progcosts','payments','docreqs','checklist','findings','recs','followups','kpis','tasks','journal'];
ACT['export-all']=()=>{
  const ents=RECON_ORDER.filter(k=>ENT[k]);
  const cntRows=ents.map(k=>[ENT[k].title,DB.all(ENT[k].store).length]);
  const warnAgg=[],warnDetail=[];
  RULES.forEach(rule=>{
    const ent=ENT[rule.ent],rows=ruleRowsAll(rule);
    if(!rows.length)return;
    warnAgg.push([ent.title,rule.label,RULE_TONE[rule.tone]||rule.tone,rows.length]);
    rows.forEach(r=>{const per=ent.period&&r.periodId?pLabel(DB.get('periods',r.periodId)):'';warnDetail.push([ent.title,rule.label,RULE_TONE[rule.tone]||rule.tone,ent.label(r)||r.id,per,r.id])});
  });

  warnDetail.sort((a,b)=>(a[2]==='Nghiêm trọng'?0:a[2]==='Cần chú ý'?1:2)-(b[2]==='Nghiêm trọng'?0:b[2]==='Cần chú ý'?1:2)||a[0].localeCompare(b[0],'vi'));

    ['Ngày xuất',fmtDate(todayStr())],

  const warnDetailSheet={name:'Chi tiết cảnh báo',head:['Nhóm dữ liệu','Cảnh báo','Mức độ','Bản ghi','Kỳ liên quan','ID'],rows:warnDetail};
  const dataSheets=ents.map(k=>sheetOf(ENT[k].title,ENT[k],DB.all(ENT[k].store)));
  download(`KTKS_DoiChieu_TongThe_${stamp()}.xls`,xlsXml([overview,warnAggSheet,warnDetailSheet,...dataSheets]),'application/vnd.ms-excel');
  toast(`Đã xuất Excel đối chiếu (${warnDetail.length} cảnh báo, ${ents.length} nhóm dữ liệu)`);

/* ===================== NHẬP DỮ LIỆU TỪ EXCEL / CSV ===================== */
const importableFields=ent=>ent.fields.filter(f=>!['computed','info','auto'].includes(f.t)&&!f.noForm);

/* ---------- Đọc CSV (tự nhận dấu phẩy/chấm phẩy, có ngoặc kép) ---------- */
function detectDelim(line){const c=(line.match(/,/g)||[]).length,sc=(line.match(/;/g)||[]).length;return sc>c?';':','}
function parseCSV(text){
  text=text.replace(/^\uFEFF/,'');
  const delim=detectDelim((text.split(/\r?\n/)[0])||',');
  const rows=[];let i=0,field='',row=[],inQ=false;
  while(i<text.length){
    const c=text[i];
    if(inQ){
      if(c==='"'){if(text[i+1]==='"'){field+='"';i+=2;continue}inQ=false;i++;continue}
      field+=c;i++;continue;
    }
    if(c==='"'){inQ=true;i++;continue}
    if(c===delim){row.push(field);field='';i++;continue}
    if(c==='\r'){i++;continue}
    if(c==='\n'){row.push(field);rows.push(row);row=[];field='';i++;continue}
    field+=c;i++;
  }
  if(field!==''||row.length){row.push(field);rows.push(row)}
  return rows.filter(r=>r.some(c=>String(c||'').trim()!==''));
}

/* ---------- Đọc .xlsx bằng API trình duyệt sẵn có (không cần thư viện ngoài) ---------- */
async function inflateRaw(bytes){
  const ds=new DecompressionStream('deflate-raw');
  const stream=new Blob([bytes]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function unzipEntries(buf,wantedTest){
  const dv=new DataView(buf),u8=new Uint8Array(buf);
  let eocd=-1;
  for(let p=u8.length-22;p>=Math.max(0,u8.length-22-65557);p--){if(dv.getUint32(p,true)===0x06054b50){eocd=p;break}}
  if(eocd<0)throw new Error('Không đọc được cấu trúc file (không phải .xlsx hợp lệ)');
  const cdCount=dv.getUint16(eocd+10,true),cdOffset=dv.getUint32(eocd+16,true);
  const found={};let p=cdOffset;
  for(let i=0;i<cdCount;i++){
    if(dv.getUint32(p,true)!==0x02014b50)throw new Error('Cấu trúc ZIP trong file không hợp lệ');
    const method=dv.getUint16(p+10,true),compSize=dv.getUint32(p+20,true),nameLen=dv.getUint16(p+28,true),extraLen=dv.getUint16(p+30,true),commentLen=dv.getUint16(p+32,true),localOffset=dv.getUint32(p+42,true);
    const name=new TextDecoder().decode(u8.subarray(p+46,p+46+nameLen));
    if(wantedTest(name)){
      const lp=localOffset;
      if(dv.getUint32(lp,true)!==0x04034b50)throw new Error('Dữ liệu nén trong file không hợp lệ');
      const lNameLen=dv.getUint16(lp+26,true),lExtraLen=dv.getUint16(lp+28,true),dataStart=lp+30+lNameLen+lExtraLen;
      const raw=u8.subarray(dataStart,dataStart+compSize);
      found[name]=method===8?await inflateRaw(raw):raw.slice();
    }
    p+=46+nameLen+extraLen+commentLen;
  }
  return found;
}
function parseSharedStrings(xmlText){
  if(!xmlText)return[];
  const doc=new DOMParser().parseFromString(xmlText,'application/xml');
  return[...doc.getElementsByTagName('si')].map(si=>[...si.getElementsByTagName('t')].map(t=>t.textContent).join(''));
}
function colToIndex(ref){const m=ref.match(/^([A-Z]+)/);if(!m)return 0;let s=m[1],n=0;for(let i=0;i<s.length;i++)n=n*26+(s.charCodeAt(i)-64);return n-1}
function parseSheetXml(xmlText,sst){
  const doc=new DOMParser().parseFromString(xmlText,'application/xml'),rows=[];
  for(const rowEl of doc.getElementsByTagName('row')){
    const arr=[];
    for(const c of rowEl.children){
      if(c.tagName!=='c')continue;
      const ref=c.getAttribute('r')||'',idx=ref?colToIndex(ref):arr.length,t=c.getAttribute('t'),vEl=c.getElementsByTagName('v')[0];
      let val='';
      if(t==='inlineStr'){const isEl=c.getElementsByTagName('is')[0];val=isEl?[...isEl.getElementsByTagName('t')].map(x=>x.textContent).join(''):''}
      else if(vEl){const raw=vEl.textContent;val=t==='s'?(sst[+raw]||''):raw}
      arr[idx]=val;
    }
    for(let i=0;i<arr.length;i++)if(arr[i]===undefined)arr[i]='';
    rows.push(arr);
  }
  return rows;
}
async function xlsxToRows(file){
  if(typeof DecompressionStream==='undefined')throw new Error('Trình duyệt này không hỗ trợ đọc .xlsx trực tiếp. Vui lòng mở file trong Excel, chọn Save As → CSV UTF-8, rồi nhập lại bằng file .csv đó.');
  const buf=await file.arrayBuffer();
  const entries=await unzipEntries(buf,name=>name==='xl/sharedStrings.xml'||/^xl\/worksheets\/sheet\d+\.xml$/.test(name));
  const dec=new TextDecoder('utf-8');
  const sst=parseSharedStrings(entries['xl/sharedStrings.xml']?dec.decode(entries['xl/sharedStrings.xml']):null);
  const sheetNames=Object.keys(entries).filter(n=>/^xl\/worksheets\/sheet\d+\.xml$/.test(n)).sort((a,b)=>(+a.match(/sheet(\d+)/)[1])-(+b.match(/sheet(\d+)/)[1]));
  if(!sheetNames.length)throw new Error('Không tìm thấy dữ liệu (sheet) trong file .xlsx');
  return parseSheetXml(dec.decode(entries[sheetNames[0]]),sst);
}

/* ---------- Quy đổi 1 ô dữ liệu thô sang giá trị field ---------- */
const excelSerialToISODate=n=>isoDate(new Date(Math.round((Number(n)-25569)*86400*1000)));
function parseMoneyNumber(raw){
  let s=raw.replace(/\s/g,'');const neg=/^-/.test(s);if(neg)s=s.slice(1);
  const hasComma=s.includes(','),hasDot=s.includes('.');
  if(hasComma&&hasDot){
    if(s.lastIndexOf(',')>s.lastIndexOf('.'))s=s.replace(/\./g,'').replace(',','.');
    else s=s.replace(/,/g,'');
  }else if(hasDot&&!hasComma){
    if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  }else if(hasComma&&!hasDot){
    if(/^\d{1,3}(,\d{3})+$/.test(s))s=s.replace(/,/g,'');else s=s.replace(',','.');
  }
  const n=parseFloat(s);return neg&&!isNaN(n)?-n:n;
}
function parseFieldValue(f,raw){
  raw=(raw==null?'':String(raw)).trim();
  if(raw==='')return{v:'',ok:true};
  const t=f.t;
  if(t==='cat'||t==='select'||t==='yn'){
    const opts=optsFor(f),hit=opts.find(([k,l])=>norm(l)===norm(raw)||norm(k)===norm(raw));
    return hit?{v:hit[0],ok:true}:{v:'',ok:false,err:`giá trị "${raw}" không khớp danh mục cho phép`};
  }
  if(t==='ref'){
    const e=ENT[f.ref],rows=DB.all(e.store).filter(x=>!f.where||f.where(x));
    let hit=rows.find(x=>norm(e.label(x))===norm(raw))||rows.find(x=>norm(String(x.code||x.no||''))===norm(raw))||rows.find(x=>norm(e.label(x)).startsWith(norm(raw)));
    return hit?{v:hit.id,ok:true}:{v:'',ok:false,err:`không tìm thấy "${raw}" trong ${e.title}`};
  }
  if(['money','number','pct','days'].includes(t)){
    const n=parseMoneyNumber(raw);
    return isNaN(n)?{v:'',ok:false,err:`"${raw}" không phải là số hợp lệ`}:{v:n,ok:true};
  }
  if(t==='date'||t==='month'||t==='datetime'){
    let d='';
    if(/^\d+(\.\d+)?$/.test(raw)&&Number(raw)>20000&&Number(raw)<60000)d=excelSerialToISODate(raw);
    else{let m=raw.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
      if(m)d=`${m[3]}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;
      else{m=raw.match(/^(\d{4})[\/\-](\d{1,2})(?:[\/\-](\d{1,2}))?/);if(m)d=`${m[1]}-${String(m[2]).padStart(2,'0')}-${m[3]?String(m[3]).padStart(2,'0'):'01'}`}}
    if(!d)return{v:'',ok:false,err:`"${raw}" không đúng định dạng ngày (dùng yyyy-mm-dd hoặc dd/mm/yyyy)`};
    if(t==='month')return{v:d.slice(0,7),ok:true};
    if(t==='date')return{v:d.slice(0,10),ok:true};
    const dt=new Date(d);return isNaN(dt)?{v:'',ok:false,err:`"${raw}" không đúng định dạng ngày giờ`}:{v:dt.toISOString(),ok:true};
  }
  return{v:raw,ok:true};
}
function fieldExampleText(f){
  if(f.t==='cat'||f.t==='select'||f.t==='yn'){const o=optsFor(f);return o.length?o[0][1]:''}
  if(f.t==='ref'){const rows=DB.all(ENT[f.ref].store).filter(x=>!f.where||f.where(x));return rows.length?ENT[f.ref].label(rows[0]):''}
  if(f.t==='date')return todayStr();
  if(f.t==='month')return todayStr().slice(0,7);
  if(f.t==='datetime')return todayStr()+' 08:00';
  if(['money','number','pct','days'].includes(f.t))return'0';
  return'';
}
async function importCommit(ent,rec){if(ent.beforeSave)ent.beforeSave(rec,true,null);rec.updatedAt=new Date().toISOString();await DB.put(ent.store,rec);if(ent.afterSave)await ent.afterSave(rec,true,null);return rec}

ACT['imp-run']=async el=>{
  const m=MODALS[MODALS.length-1];if(!m||!m.ctx)return;
  const ent=ENT[el.dataset.e],{data}=m.ctx;
  if(ent.period&&!curPeriod()){toast('Chưa có kỳ kiểm tra để nhập dữ liệu vào','warn');return}
  if(ent.period&&ent.lockable!==false&&curPeriod().status==='done'){toast('Kỳ đã hoàn thành, không thể nhập thêm dữ liệu','warn');return}
  const maps=$$('[data-map]',m.el).map(s=>s.value);
  let ok=0;const fail=[];
  for(let ri=0;ri<data.length;ri++){
    const row=data[ri],v={};let rowErr='';
    maps.forEach((fk,ci)=>{
      if(!fk)return;const f=fieldOf(ent,fk);if(!f)return;
      const raw=row[ci];const res=parseFieldValue(f,raw);
      if(!res.ok&&!rowErr)rowErr=`${f.l}: ${res.err}`;
      v[fk]=res.v;
    });
    if(!rowErr){const errs=validateForm(ent,v,null,{});const k=Object.keys(errs)[0];if(k)rowErr=`${(fieldOf(ent,k)||{l:k}).l}: ${errs[k]}`}
    if(rowErr){fail.push({row:ri+2,reason:rowErr});continue}
    const rec=Object.assign(defaultsFor(ent,{}),v,{id:uid(),createdAt:new Date().toISOString()});
    if(ent.period)rec.periodId=curPeriod().id;
    try{await importCommit(ent,rec);ok++}catch(e){fail.push({row:ri+2,reason:e.message})}
  }
  if(ok)await logAct('Tạo mới',ent.singular,`Nhập ${ok} bản ghi từ file Excel/CSV${fail.length?`, bỏ qua ${fail.length} dòng lỗi`:''}`,'',ent.period?curPeriod().id:undefined);
  $('#impResult',m.el).innerHTML=`<div class="banner ${fail.length?'y':'b'}"><b>Đã nhập ${ok}/${data.length} dòng.</b>${fail.length?` ${fail.length} dòng bị bỏ qua do lỗi, có thể sửa trong file rồi nhập lại riêng các dòng đó.`:''}</div>`+
   (fail.length?`<div class="tw" style="max-height:200px"><table class="t"><thead><tr><th class="ns">Dòng trong file</th><th class="ns">Lý do bỏ qua</th></tr></thead><tbody>${fail.slice(0,50).map(x=>`<tr><td>${x.row}</td><td>${esc(x.reason)}</td></tr>`).join('')}</tbody></table></div>${fail.length>50?`<div class="note">…và ${fail.length-50} dòng khác.</div>`:''}`:'');
  toast(ok?`Đã nhập ${ok}/${data.length} dòng từ file`:'Không có dòng nào nhập được, xem chi tiết lỗi bên dưới',ok?'':'warn');
  renderMain();
};

async function deletePeriod(id){

function buildBackup(scope,periodId){
  const data={};
  if(scope==='period'){
    const pid=periodId;PERIOD_STORES.forEach(s=>data[s]=DB.all(s).filter(r=>r.periodId===pid));
    const extraRec=DB.all('recs').filter(r=>r.periodId!==pid&&data.followups.some(f=>f.recId===r.id));
    data.recs=[...data.recs,...extraRec];
    const extraF=DB.all('findings').filter(f=>f.periodId!==pid&&extraRec.some(r=>r.findingId===f.id));data.findings=[...data.findings,...extraF];
    const pids=new Set([pid,...extraF.map(f=>f.periodId)]);data.periods=DB.all('periods').filter(p=>pids.has(p.id));
    GLOBAL_STORES.forEach(s=>data[s]=DB.all(s));
  }else DATA_STORES.forEach(s=>data[s]=DB.all(s));
  DATA_STORES.forEach(s=>{if(!data[s])data[s]=[]});
  const cnt=s=>data[s].length,pr=periodId?DB.get('periods',periodId):null;
  return{meta:{app:APP_ID,appVersion:APP_VERSION,backupVersion:BACKUP_VERSION,backupDate:new Date().toISOString(),scope,periodId:periodId||null,periodLabel:pr?pLabel(pr):null,
   counts:{periods:cnt('periods'),projects:cnt('projects'),contracts:cnt('contracts'),customers:cnt('customers'),checklist:cnt('checklist'),findings:cnt('findings'),recs:cnt('recs'),followups:cnt('followups')},checksum:hash32(JSON.stringify(data))},settings:DB.meta.settings||{},data};
}

const REQ_FIELDS={periods:['year','quarter'],findings:['periodId','code'],recs:['findingId'],contracts:['no'],projects:['code'],customers:['code'],catalogs:['group','key'],checklist:['periodId'],followups:['recId']};
function validateBackup(o){
  const errors=[],warnings=[];
  if(!o||typeof o!=='object'||Array.isArray(o))return{ok:false,errors:['Nội dung file không phải một đối tượng JSON hợp lệ'],warnings};
  if(!o.meta||o.meta.app!==APP_ID)errors.push('Không phải file sao lưu của ứng dụng KTKS Phòng Dự án (thiếu hoặc sai meta.app)');
  else if(typeof o.meta.backupVersion!=='number')errors.push('Thiếu meta.backupVersion');
  else if(o.meta.backupVersion>BACKUP_VERSION)errors.push(`File sao lưu thuộc phiên bản mới hơn (${o.meta.backupVersion}) – cần cập nhật ứng dụng`);
  if(!o.data||typeof o.data!=='object'||Array.isArray(o.data)){errors.push('Thiếu khối dữ liệu "data"');return{ok:false,errors,warnings}}
  let total=0;
  for(const s of DATA_STORES){
    const a=o.data[s];if(a===undefined)continue;
    if(!Array.isArray(a)){errors.push(`"${s}" phải là một mảng`);continue}
    const ids=new Set();
    a.forEach((r,i)=>{
      if(errors.length>=12)return;
      if(!r||typeof r!=='object'||Array.isArray(r)){errors.push(`${s}[${i}]: bản ghi không hợp lệ`);return}
      if(typeof r.id!=='string'||!r.id){errors.push(`${s}[${i}]: thiếu id`);return}
      if(ids.has(r.id)){errors.push(`${s}: trùng id "${r.id}"`);return}ids.add(r.id);
      (REQ_FIELDS[s]||[]).forEach(k=>{if(r[k]==null||r[k]==='')errors.push(`${s}[${i}]: thiếu trường "${k}"`)});
    });
    total+=a.length;
  }
  Object.keys(o.data).forEach(k=>{if(!DATA_STORES.includes(k))warnings.push(`Bỏ qua nhóm dữ liệu không nhận diện được: "${k}"`)});
  if(!total&&!errors.length)warnings.push('File không chứa bản ghi nào');
  if(!errors.length){
    const pset=new Set((o.data.periods||[]).map(p=>p.id));let orphan=0;
    PERIOD_STORES.forEach(s=>(o.data[s]||[]).forEach(r=>{if(r.periodId&&!pset.has(r.periodId)&&!DB.get('periods',r.periodId))orphan++}));
    if(orphan)warnings.push(`${orphan} bản ghi tham chiếu tới kỳ không có trong file (và chưa có trong máy)`);
    if(o.meta.checksum&&o.meta.checksum!==hash32(JSON.stringify(o.data)))warnings.push('Mã kiểm tra (checksum) không khớp – file có thể đã bị chỉnh sửa hoặc hỏng một phần');
  }
  return{ok:!errors.length,errors:errors.slice(0,12),warnings};
}
function mergePlan(o){
  const out={};
  DATA_STORES.forEach(s=>{const a=o.data[s];if(!Array.isArray(a)||!a.length)return;const ex=new Map(DB.all(s).map(r=>[r.id,r]));let nw=0,diff=0,same=0;
    a.forEach(r=>{const e=ex.get(r.id);if(!e)nw++;else if(JSON.stringify(e)===JSON.stringify(r))same++;else diff++});out[s]={total:a.length,nw,diff,same}});
  return out;
}

CHG['restore-file']=async el=>{
  const f=el.files&&el.files[0];if(!f)return;let text,obj;
  try{text=await f.text()}catch(e){UI.restore={name:f.name,error:'Không đọc được file: '+e.message};renderMain();return}
  try{obj=JSON.parse(text)}catch(e){UI.restore={name:f.name,error:'File không phải JSON hợp lệ ('+e.message+'). Dữ liệu hiện tại không bị ảnh hưởng.'};renderMain();return}
  UI.restore={name:f.name,size:f.size,obj,val:validateBackup(obj),mode:'merge',policy:{catalogs:'backup'}};renderMain();
};
CHG['rs-mode']=el=>{UI.restore.mode=el.value;renderMain()};
CHG['rs-policy']=el=>{UI.restore.policy[el.dataset.s]=el.value};
ACT['rs-cancel']=()=>{UI.restore=null;renderMain()};
ACT['rs-apply']=async()=>{
  const R=UI.restore;if(!R||!R.val||!R.val.ok){toast('File chưa hợp lệ','err');return}
  const o=R.obj;
  if(R.mode==='replace'){
    const ok=await confirmBox({title:'Thay thế toàn bộ dữ liệu',danger:true,ok:'Thay thế',html:true,msg:`Toàn bộ dữ liệu hiện tại sẽ bị thay bằng nội dung file <b>${esc(R.name)}</b>. Một bản sao lưu an toàn sẽ được tự tải về trước.`});
    if(!ok)return;
    safetyBackup('BeforeRestore');
    try{await DB.replaceAll(o.data)}catch(e){console.error(e);toast('Phục hồi thất bại, dữ liệu cũ được giữ nguyên: '+e.message,'err');return}
    if(o.settings)await DB.setMeta('settings',o.settings);
    { const vv=String((o.meta&&o.meta.appVersion)||'0').split('.').map(Number);await DB.setMeta('catMig',(vv[0]>1||(vv[0]===1&&(vv[1]||0)>=4))?'1.4':''); }
    if(!DB.all('catalogs').length)await seedCatalogs();
    const ps=periodsSorted();await DB.setMeta('currentPeriod',ps.length?ps[ps.length-1].id:null);
    await syncFollowups();await logAct('Phục hồi','Hệ thống',`Thay thế toàn bộ dữ liệu từ file ${R.name}`);
  }else{
    const plan=mergePlan(o),map={};let added=0,over=0;
    Object.keys(plan).forEach(s=>{
      const pol=R.policy[s]||'keep';if(pol==='skip')return;const ex=new Map(DB.all(s).map(r=>[r.id,r])),put=[];
      o.data[s].forEach(r=>{const e=ex.get(r.id);if(!e){put.push(r);added++}else if(pol==='backup'&&JSON.stringify(e)!==JSON.stringify(r)){put.push(r);over++}});
      if(put.length)map[s]=put;
    });
    if(!Object.keys(map).length){toast('Không có gì để nhập (mọi bản ghi đã tồn tại hoặc bị bỏ qua)','warn');return}
    const ok=await confirmBox({title:'Nhập bổ sung',ok:'Nhập',html:true,msg:`Sẽ thêm <b>${added}</b> bản ghi mới và ghi đè <b>${over}</b> bản ghi trùng. Bản sao lưu an toàn sẽ được tự tải về trước.`});
    if(!ok)return;
    safetyBackup('BeforeMerge');
    try{await DB.mergeMany(map)}catch(e){console.error(e);toast('Nhập thất bại: '+e.message,'err');return}
    if(!DB.get('periods',DB.meta.currentPeriod)){const ps=periodsSorted();if(ps.length)await DB.setMeta('currentPeriod',ps[ps.length-1].id)}
    await syncFollowups();await logAct('Phục hồi','Hệ thống',`Nhập bổ sung từ file ${R.name}: +${added} mới, ${over} ghi đè`);
  }
  await ensureCatalogMigrations();await migrateContractModel();
  UI.restore=null;toast('Phục hồi hoàn tất');go('dashboard');renderMain();
};

ACT['np-create']=async()=>{
  const g=id=>$('#'+id).value,year=parseInt(g('npYear'),10),quarter=g('npQ'),start=g('npStart'),end=g('npEnd');
  if(!(year>=2000&&year<=2100)){toast('Năm không hợp lệ','warn');return}
  if(!start||!end){toast('Nhập ngày bắt đầu và kết thúc dự kiến','warn');return}
  if(end<start){toast('Ngày kết thúc phải sau ngày bắt đầu','warn');return}
  if(DB.all('periods').some(p=>Number(p.year)===year&&String(p.quarter)===quarter)){toast(`Kỳ Q${quarter}/${year} đã tồn tại`,'warn');return}
  const now=new Date().toISOString(),p={id:uid(),year,quarter,start,end,inspector:g('npIns'),head:g('npHead'),status:'notstarted',scope:g('npScope'),objective:g('npObj'),note:g('npNote'),conclusion:'',createdAt:now,updatedAt:now};
  await DB.put('periods',p);
  const src=g('npSrc');let copied=0;
  if(src){
    const cp=async(store,fn)=>{const a=DB.all(store).filter(r=>r.periodId===src).map(r=>({...fn(r),id:uid(),periodId:p.id,createdAt:now,updatedAt:now}));await DB.putMany(store,a);copied+=a.length};
    if($('#cpChk').checked)await cp('checklist',r=>({...r,result:'todo',evidence:'',comment:'',risk:'',rec:''}));
    if($('#cpDoc').checked)await cp('docreqs',r=>({...r,status:'none',reqDate:'',deadline:'',recvDate:'',evidence:'',note:''}));
    if($('#cpKpi').checked)await cp('kpis',r=>({...r,prev:isNum(r.actual)?r.actual:r.prev,actual:'',failCause:'',explain:'',note:''}));
    if($('#cpTask').checked)await cp('tasks',r=>({...r,status:'na',deadline:'',expected:r.expected,actualRes:'',doneDate:'',evidence:'',cause:'',note:''}));
    if($('#cpInv').checked){await cp('investments',r=>({...r,note:''}));await cp('progcosts',r=>({...r,note:''}))}
  }
  await DB.setMeta('currentPeriod',p.id);const fu=await syncFollowups(p.id);
  await logAct('Tạo mới','Kỳ kiểm tra',`Tạo kỳ ${pLabel(p)}; sao chép ${copied} bản ghi cấu trúc; chuyển ${fu} tồn tại từ kỳ trước`,'',p.id);
  toast(`Đã tạo kỳ ${pLabel(p)}${fu?` – có ${fu} tồn tại kỳ trước cần follow-up`:''}`);go(fu?'followups':'dashboard');renderMain();
};

    ['site','Kho chung HNT Đông Anh'],['site','Kho chung HNT Nguyên Khê'],['site','Kho chung HNT Thanh Oai'],
    ['svcType','Bốc xếp hàng lẻ nguyên kiện (theo m³)'],['svcType','Bốc xếp hàng lẻ nguyên kiện (theo tấn)'],['svcType','Bốc xếp hàng lẻ nguyên kiện (theo pallet)'],
    ['svcType','Dán tem nhãn'],['svcType','Tháo dỡ kiện hàng'],['svcType','Đóng pallet kiện hàng (nguyên carton)'],
    ['svcType','Dịch vụ ngoài giờ (150%)'],['svcType','Dịch vụ ngày lễ/tết (200%)'],
    ['svcMethod','Theo m³'],['svcMethod','Theo tấn'],['svcMethod','Theo pallet'],['svcMethod','Theo tem'],['svcMethod','Theo giờ (150%)'],['svcMethod','Theo giờ (200%)'],
    ['chkGroup','Hoa hồng khách hàng mới']
  ];
  let added=0;
  for(const[g,name]of need){
    if(DB.all('catalogs').some(x=>x.group===g&&x.name===name))continue;
    const k='k'+(catItems(g).length+1)+'_'+hash32(name).slice(0,4);
    await DB.put('catalogs',{id:g+'.'+k,group:g,key:k,name,tone:'',order:catItems(g).length});
    added++;
  }
  await DB.setMeta('catMig','1.5');
  const needSys=[['contractStatus','active','Đang hiệu lực','green',0],['contractStatus','ended','Đã thanh lý/kết thúc','gray',1]];
  for(const[g,k,name,tone,order]of needSys){
    if(DB.all('catalogs').some(x=>x.group===g&&x.key===k))continue;
    await DB.put('catalogs',{id:g+'.'+k,group:g,key:k,name,tone,order,lock:1});
    added++;
  }
  await seedHntStoragePolicy();
  await seedHntRenewalPolicy();
  return added;
}

/* Chuyển dữ liệu cũ (giá gắn ở hợp đồng + "hạng mục thuê" theo danh mục) sang mô hình mới. An toàn, chạy lặp lại không đổi thêm. */
async function migrateContractModel(){
  const cts=DB.all('contracts'),rts=DB.all('rentals');
  const legacy=rts.filter(r=>!r.kind),needC=cts.filter(c=>!c.model);
  if(!legacy.length&&!needC.length)return 0;
  const now=new Date().toISOString(),rtPut=[],ctPut=[];
  const kindOf=r=>{const n=norm(catName('rentalType',r.itemType)),m=norm(catName('rentalMethod',r.method))+' '+norm(r.unit||'');
    let k=/bai/.test(n)?'bai':/van phong/.test(n)?'vp':/kho/.test(n)?'kho':'other';
    if(k==='kho'&&/pallet|m³|m3|\btan\b/.test(m))k='luukho';return k};
  const upd=new Map();
  legacy.forEach(r=>{const kind=kindOf(r),u=LINE_UNITS.some(x=>x[0]===r.unit)?r.unit:(KIND_DEF[kind].unit);const n={...r,kind,unit:u,per:r.per||'month',updatedAt:now};upd.set(r.id,n);rtPut.push(n)});
  const allRt=rts.map(r=>upd.get(r.id)||r);
  for(const c of needC){
    const lines=allRt.filter(r=>r.contractId===c.id);
    const model=(norm(catName('contractType',c.type)).includes('tron goi')||lines.some(l=>l.kind==='luukho'))?'storage':'lease';
    if(!lines.some(l=>l.kind==='kho'||l.kind==='luukho')&&isNum(c.unitPrice)&&N(c.unitPrice)>0)
      rtPut.push({id:uid(),createdAt:now,updatedAt:now,contractId:c.id,kind:model==='storage'?'luukho':'kho',unit:'m²',per:'month',quantity:isNum(c.area)?c.area:'',unitPrice:c.unitPrice,monthlyEstimate:isNum(c.monthly)?c.monthly:(isNum(c.area)?Math.round(N(c.area)*N(c.unitPrice)):''),startDate:c.effDate||'',endDate:'',note:'Chuyển từ đơn giá cũ ghi ở hợp đồng'});
    ctPut.push({...c,model,updatedAt:now});
  }
  if(rtPut.length)await DB.putMany('rentals',rtPut);
  if(ctPut.length)await DB.putMany('contracts',ctPut);
  await logAct('Cập nhật','Hợp đồng',`Chuyển ${ctPut.length} hợp đồng và ${rtPut.length} dòng đơn giá sang mô hình mới (Thuê kho / Lưu kho trọn gói)`);
  return ctPut.length;
}

/* ---------- Khởi động ---------- */
async function boot(){
  await DB.init();
  if(!DB.all('catalogs').length){await seedCatalogs();await DB.setMeta('catMig','1.5')}
  else{await ensureCatalogMigrations()}
  await JSYNC.restore();
  if(!DB.meta.seeded){await DB.setMeta('seeded',true)}
  await seedHntStoragePolicy();
  await seedHntRenewalPolicy();
  await migrateContractModel();
  await syncFollowups();
  $('#userChip').addEventListener('click',()=>ACT['edit-user']());
  window.addEventListener('hashchange',renderMain);
  renderMain();
}
window.addEventListener('error',e=>{console.error(e.error||e.message)});
window.addEventListener('unhandledrejection',e=>{console.error(e.reason);toast('Lỗi: '+(e.reason&&e.reason.message||e.reason),'err')});
/* Chặn khung xem trước của Claude coi link nội bộ (#/...) là link ngoài */
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href^="#/"]');if(!a)return;e.preventDefault();e.stopPropagation();const h=a.getAttribute('href');if(location.hash===h)renderMain();else location.hash=h},true);
boot();
</script></body></html>
