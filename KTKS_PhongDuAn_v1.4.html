<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KTKS Phòng Dự án v1.5.3 – Kiểm tra kiểm soát nội bộ (Kèm QĐ 11 Lưu kho &amp; QĐ 176 Gia hạn HĐ)</title>
<style>
:root{
  --ink:#16232b;--ink2:#41525e;--mute:#6b7b87;--line:#dbe2e7;--line2:#e9eef1;
  --bg:#f1f4f5;--card:#fff;--side:#0f2a33;--side2:#163842;--side-tx:#b9cdd4;
  --pri:#0b6e6e;--pri-d:#08504f;--pri-l:#e2f2f1;--brass:#b98524;--brass-l:#fbf1d9;
  --g:#177a46;--g-bg:#e2f4ea;--y:#a5680b;--y-bg:#fcf0d0;--r:#b93030;--r-bg:#fbe6e4;--s:#5d6b76;--s-bg:#e9edf0;--b:#1f5f99;--b-bg:#e3eefa;
  --rad:6px;--sh:0 1px 2px rgba(15,42,51,.06),0 2px 8px rgba(15,42,51,.04);
  --font:"Segoe UI","Helvetica Neue",Arial,"Noto Sans",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 var(--font);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri)}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px}
#app{display:grid;grid-template-columns:262px 1fr;min-height:100vh}
/* Sidebar */
.sidebar{background:var(--side);color:var(--side-tx);position:sticky;top:0;height:100vh;overflow-y:auto;padding-bottom:20px}
.brand{padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand b{display:block;color:#fff;font-size:15px;font-weight:650;letter-spacing:.1px}
.brand span{font-size:12px;color:#8fa9b2}
.nav-g{margin-top:14px}
.nav-g>.gl{padding:4px 18px;font-size:12px;color:#7f9ba5;font-weight:600;display:flex;align-items:center;gap:8px}
.nav a{display:block;padding:7px 18px 7px 42px;color:var(--side-tx);text-decoration:none;font-size:13.5px;border-left:3px solid transparent;position:relative}
.nav a:hover{background:var(--side2);color:#fff}
.nav a.on{background:var(--side2);color:#fff;border-left-color:var(--brass);font-weight:600}
.nav a.top{padding-left:18px;margin-top:10px;font-weight:600}
/* Topbar */
.content{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 24px;flex-wrap:wrap}
.hamb{display:none}
.period-pill{display:flex;align-items:center;gap:8px;background:var(--brass-l);border:1px solid #ecd79c;border-radius:20px;padding:3px 4px 3px 12px;font-size:13px}
.period-pill b{color:#6b4a0d}
.period-pill select{border:0;background:transparent;font-weight:600;color:#6b4a0d;cursor:pointer;padding:3px 2px;max-width:170px}
.tb-sp{flex:1}
.savestat{font-size:12.5px;color:var(--mute);display:flex;align-items:center;gap:6px}
.savestat i{width:8px;height:8px;border-radius:50%;background:var(--g);display:inline-block}
.savestat.err i{background:var(--r)}
.userchip{font-size:13px;color:var(--ink2);cursor:pointer;border:1px solid var(--line);border-radius:20px;padding:3px 12px;background:#fff}
.userchip:hover{border-color:var(--pri)}
#main{padding:22px 24px 60px;max-width:1680px;width:100%}
.banner{border-radius:var(--rad);padding:10px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;font-size:13.5px;border:1px solid}
.banner.y{background:var(--y-bg);border-color:#efd58f;color:#6f470a}
.banner.r{background:var(--r-bg);border-color:#efb9b5;color:#7c1f1f}
.banner.b{background:var(--b-bg);border-color:#b6d1ec;color:#174a78}
.banner .sp{flex:1}
/* Page head */
.ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ph h1{margin:0;font-size:21px;font-weight:650;letter-spacing:.1px}
.ph p{margin:2px 0 0;color:var(--mute);font-size:13.5px;max-width:760px}
.ph .sp{flex:1}
.acts{display:flex;gap:8px;flex-wrap:wrap}
/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:var(--rad);padding:7px 13px;cursor:pointer;font-size:13.5px;font-weight:550;white-space:nowrap;color:var(--ink)}
.btn:hover{border-color:#b7c4cc;background:#f8fafb}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri-d)}
.btn.dng{background:var(--r);border-color:var(--r);color:#fff}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}
.btn.ghost:hover{background:var(--s-bg)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.ibtn{border:0;background:transparent;padding:5px;border-radius:5px;cursor:pointer;color:var(--ink2);display:inline-flex}
.ibtn:hover{background:var(--s-bg);color:var(--pri)}
.ibtn.del:hover{color:var(--r);background:var(--r-bg)}
/* Cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--sh)}
.card>h3,.card .ch{margin:0;padding:12px 16px;font-size:14.5px;font-weight:650;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:8px}
.card .cb{padding:14px 16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-a{grid-template-columns:1.55fr 1fr}
.mb{margin-bottom:14px}
/* Tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:12px;margin-bottom:14px}
.tile{background:#fff;border:1px solid var(--line);border-radius:var(--rad);padding:11px 14px 11px 16px;cursor:pointer;position:relative;box-shadow:var(--sh);text-align:left;overflow:hidden}
.tile:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--s)}
.tile.g:before{background:var(--g)}.tile.y:before{background:#d99a1e}.tile.r:before{background:var(--r)}.tile.b:before{background:var(--b)}.tile.p:before{background:var(--pri)}
.tile:hover{border-color:#9fb4be}
.tile .n{font-size:26px;font-weight:650;line-height:1.15}
.tile .l{font-size:12.5px;color:var(--ink2)}
.tile .h{font-size:11.5px;color:var(--mute)}
.tile.zero .n{color:#9aa8b1}
/* Badges */
.badge{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;font-weight:600;background:var(--s-bg);color:var(--s);white-space:nowrap}
.badge.green{background:var(--g-bg);color:var(--g)}.badge.yellow{background:var(--y-bg);color:var(--y)}.badge.red{background:var(--r-bg);color:var(--r)}.badge.gray{background:var(--s-bg);color:var(--s)}.badge.blue{background:var(--b-bg);color:var(--b)}
.badge.dark{background:#7c1f1f;color:#fff}
.alp{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:1px 8px;border-radius:10px;font-weight:600;margin:1px 3px 1px 0;white-space:nowrap}
.alp.r{background:var(--r-bg);color:var(--r)}.alp.y{background:var(--y-bg);color:var(--y)}.alp.b{background:var(--b-bg);color:var(--b)}
/* Filter bar */
.fbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.fbar .sb{position:relative;flex:1;min-width:220px;max-width:340px}
.fbar .sb svg{position:absolute;left:10px;top:9px;color:var(--mute)}
.fbar .sb input{padding-left:32px;width:100%}
input[type=text],input[type=number],input[type=date],input[type=month],input[type=datetime-local],input[type=email],input[type=search],select,textarea{border:1px solid #c9d3d9;border-radius:var(--rad);padding:7px 10px;background:#fff;width:100%;min-height:34px}
.fbar select{width:auto;max-width:200px}
input:focus,select:focus,textarea:focus,button:focus-visible,.tile:focus-visible{outline:2px solid #6bb8b5;outline-offset:1px;border-color:var(--pri)}
textarea{resize:vertical;min-height:70px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--b-bg);color:var(--b);border-radius:14px;padding:3px 6px 3px 11px;font-size:12.5px;font-weight:600}
.chip button{border:0;background:transparent;cursor:pointer;color:inherit;padding:0 3px;font-size:15px;line-height:1}
/* Table */
.tw{overflow:auto;border:1px solid var(--line);border-radius:var(--rad);background:#fff;box-shadow:var(--sh)}
table.t{border-collapse:collapse;width:100%;font-size:13.5px}
table.t th{position:sticky;top:0;background:#eef2f4;text-align:left;font-weight:650;font-size:12.5px;color:var(--ink2);padding:9px 10px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;vertical-align:bottom;line-height:1.25}
table.t th.ns{cursor:default}
table.t th .ar{color:var(--pri);margin-left:3px}
table.t td{padding:8px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
table.t tr:hover td{background:#f7fafb}
table.t td.num,table.t th.num{text-align:right}
table.t td.tr{white-space:nowrap;text-align:right}
table.t td .trunc{display:block;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.t tr.lock td{background:#fafafa;color:#4d5b65}
table.t select.inl{width:auto;min-height:28px;padding:3px 6px;font-size:12.5px;font-weight:600}
table.t td .code{font-weight:650;color:var(--pri-d);cursor:pointer}
.pager{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 4px;color:var(--mute);font-size:13px;flex-wrap:wrap}
.pager .pg{display:flex;gap:4px}
.pager .pg button{min-width:32px}
.pager .pg button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.empty{text-align:center;padding:44px 20px;color:var(--mute);background:#fff;border:1px dashed #c2cfd6;border-radius:var(--rad)}
.empty b{display:block;color:var(--ink2);font-size:15px;margin-bottom:4px}
.empty .btn{margin-top:12px}
/* Modal */
.ov{position:fixed;inset:0;background:rgba(10,28,34,.5);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow:auto}
.modal{background:#fff;border-radius:8px;width:100%;max-width:860px;box-shadow:0 18px 60px rgba(0,0,0,.35);display:flex;flex-direction:column;max-height:92vh}
.modal.sm{max-width:480px}.modal.lg{max-width:1040px}
.modal .mh{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal .mh h2{margin:0;font-size:17px;font-weight:650;flex:1}
.modal .mb2{padding:16px 20px;overflow:auto;flex:1}
.modal .mf{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:#f8fafb;border-radius:0 0 8px 8px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:8px 14px;cursor:pointer;font-weight:600;color:var(--mute);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--pri-d);border-bottom-color:var(--pri)}
.tabs button.has-err{color:var(--r)}
.tabs button:hover{color:var(--ink)}
.tp{display:none}.tp.on{display:block}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.fld.full{grid-column:1/-1}
.fld label{display:block;font-size:12.8px;font-weight:600;color:var(--ink2);margin-bottom:3px}
.fld label .rq{color:var(--r);margin-left:2px}
.fld .hp{font-size:12px;color:var(--mute);margin-top:2px}
.fld.err input,.fld.err select,.fld.err textarea{border-color:var(--r);background:#fff8f7}
.fld .em{color:var(--r);font-size:12.3px;margin-top:2px}
.calc{min-height:34px;display:flex;align-items:center;padding:6px 10px;background:#f2f6f7;border:1px dashed #c2cfd6;border-radius:var(--rad);font-weight:600}
.info{background:#f5f9f9;border:1px solid var(--line);border-radius:var(--rad);padding:10px 12px;font-size:13px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 18px}
.info .ih{grid-column:1/-1;font-weight:650;color:var(--pri-d);margin-top:4px}
.info span{color:var(--mute)}
.frm-al{grid-column:1/-1}
.secl{grid-column:1/-1;font-weight:650;color:var(--pri-d);border-bottom:1px solid var(--line2);padding-bottom:3px;margin-top:6px;font-size:13.5px}
/* Toast */
#toasts{position:fixed;right:18px;bottom:18px;z-index:300;display:flex;flex-direction:column;gap:8px}
.toast{background:#123;color:#fff;padding:10px 16px;border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.25);font-size:13.5px;max-width:380px;border-left:4px solid var(--g);animation:tin .18s ease-out}
.toast.warn{border-left-color:#e2a52c}.toast.err{border-left-color:#e05a52}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
/* Dashboard */
.hero{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;padding:18px 22px;margin-bottom:14px}
.hero h2{margin:0 0 2px;font-size:19px}
.hero .meta{color:var(--ink2);font-size:13.5px;display:flex;gap:18px;flex-wrap:wrap;margin-top:6px}
.hero .meta span b{color:var(--ink)}
.donut{position:relative;width:118px;height:118px}
.donut .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut .c b{font-size:24px;line-height:1}
.donut .c small{color:var(--mute);font-size:11.5px}
.sbar{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--s-bg)}
.sbar i{display:block;height:100%}
.c-g{background:#3aa46b}.c-y{background:#e3a72f}.c-r{background:#d0453f}.c-s{background:#9dabb5}.c-b{background:#4a86c0}.c-d{background:#7c1f1f}.c-l{background:#dfe6ea}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.hbar{display:grid;grid-template-columns:150px 1fr 34px;gap:10px;align-items:center;margin:7px 0;font-size:13px}
.hbar .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .ct{text-align:right;font-weight:650}
.vbars{display:flex;gap:18px;align-items:flex-end;height:150px;padding:6px 6px 0}
.vbars .vb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:pointer}
.vbars .vb i{display:block;width:100%;max-width:64px;border-radius:4px 4px 0 0;min-height:2px}
.vbars .vb b{font-size:13px;margin-bottom:3px}
.vbars .vb span{font-size:12px;color:var(--ink2);margin-top:5px;text-align:center}
.alrow{display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--line2);cursor:pointer;font-size:13.5px}
.alrow:hover{background:#f7fafb}
.alrow .n{min-width:34px;text-align:center;font-weight:700;border-radius:12px;padding:1px 8px}
.alrow .n.r{background:var(--r-bg);color:var(--r)}.alrow .n.y{background:var(--y-bg);color:var(--y)}.alrow .n.z{background:var(--s-bg);color:var(--mute)}.alrow .n.b{background:var(--b-bg);color:var(--b)}
.alrow .sp{flex:1}
.alrow.zero{color:var(--mute)}
.sumline{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:12px;background:#fff;border:1px solid var(--line);border-radius:var(--rad);padding:10px 16px;box-shadow:var(--sh)}
.sumline div{font-size:12.5px;color:var(--mute)}
.sumline b{display:block;font-size:17px;color:var(--ink)}
.sumline b.r{color:var(--r)}
.note{font-size:12.5px;color:var(--mute)}
.kv{display:grid;grid-template-columns:170px 1fr;gap:6px 14px;font-size:13.5px}
.kv dt{color:var(--mute)}.kv dd{margin:0}
.opt{display:flex;gap:9px;align-items:flex-start;padding:6px 0}
.opt input{margin-top:3px;width:auto;min-height:0}
.dz{border:2px dashed #b3c3cb;border-radius:8px;padding:22px;text-align:center;background:#fafcfc}
.tabsline{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
/* Report */
.report-doc{background:#fff;max-width:900px;margin:0 auto;padding:44px 56px;border:1px solid var(--line);box-shadow:var(--sh);font-family:"Times New Roman",Times,serif;font-size:14.5px;line-height:1.55;color:#111}
.report-doc h1{text-align:center;font-size:20px;margin:0 0 4px;text-transform:uppercase}
.report-doc .sub{text-align:center;font-style:italic;margin-bottom:20px}
.report-doc h2{font-size:16px;margin:22px 0 8px;border-bottom:1px solid #999;padding-bottom:2px}
.report-doc table{border-collapse:collapse;width:100%;margin:8px 0 12px;font-size:13.5px}
.report-doc th,.report-doc td{border:1px solid #777;padding:4px 7px;vertical-align:top;text-align:left}
.report-doc th{background:#e9edef}
.report-doc td.n,.report-doc th.n{text-align:right}
.report-doc .rb{display:inline-block;padding:0 6px;border:1px solid #777;font-size:12px;font-weight:700}
.report-doc .sig{display:grid;grid-template-columns:1fr 1fr;text-align:center;margin-top:36px}
.report-doc p{margin:5px 0}
.hide{display:none!important}
@media (max-width:1100px){.g-a,.g3,.g4{grid-template-columns:1fr 1fr}}
@media (max-width:900px){
  #app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:-280px;width:262px;z-index:60;transition:left .2s}
  body.nav-open .sidebar{left:0}
  .hamb{display:inline-flex}
  .g2,.g3,.g4,.g-a{grid-template-columns:1fr}
  .fgrid,.info{grid-template-columns:1fr}
  #main{padding:16px 12px 50px}
  .hero{grid-template-columns:1fr}
  .report-doc{padding:20px}
}
@media print{
  .sidebar,.topbar,.no-print,#toasts,.banner{display:none!important}
  #app{display:block}body{background:#fff}#main{padding:0;max-width:none}
  .report-doc{border:0;box-shadow:none;padding:0;max-width:none}
  .report-doc h2{break-after:avoid}.report-doc tr{break-inside:avoid}
  .ov{display:none}
}
@media (prefers-reduced-motion:reduce){.toast{animation:none}.sidebar{transition:none}}

table.t td .code{white-space:nowrap}
table.t td.tr{position:sticky;right:0;background:#fff;box-shadow:-6px 0 8px -6px rgba(15,42,51,.18)}
table.t th:last-child{position:sticky;right:0;z-index:2}
table.t tr:hover td.tr{background:#f7fafb}
table.t tr.lock td.tr{background:#fafafa}
input[type=file]{border:1px solid #c9d3d9;border-radius:var(--rad);padding:6px 8px;background:#fff;width:100%;font-size:13px}
/* JSON Sync */
.jsync-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--rad);border:1px solid var(--line2);background:#f8fbff;margin-bottom:12px;font-size:13.5px;flex-wrap:wrap}
.jsync-bar .jlabel{font-weight:600;color:var(--ink2);white-space:nowrap}
.jsync-bar .jfile{flex:1;min-width:140px;color:var(--pri);font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jsync-bar .jfile.none{color:var(--mute);font-weight:400;font-style:italic}
.jsync-st{font-size:12px;padding:2px 8px;border-radius:10px;white-space:nowrap}
.jsync-st.ok{background:var(--g-bg);color:var(--g)}.jsync-st.saving{background:var(--y-bg);color:var(--y)}.jsync-st.err{background:var(--r-bg);color:var(--r)}.jsync-st.idle{background:var(--s-bg);color:var(--s)}
#syncInd{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:4px;white-space:nowrap;min-width:0}
#syncInd.saving{color:var(--y)}#syncInd.ok{color:var(--g)}#syncInd.err{color:var(--r)}
</style>
</head>
<body>
<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><b>KTKS – Phòng Dự án</b><span>Kiểm tra kiểm soát nội bộ hàng quý</span></div>
    <nav class="nav" id="nav" aria-label="Menu chính"></nav>
  </aside>
  <div class="content">
    <header class="topbar">
      <button class="btn ghost hamb" data-act="hamb" aria-label="Mở menu"><svg class="i" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <div class="period-pill" id="topPeriod"></div>

/* ---------- Cơ sở dữ liệu (IndexedDB + bộ nhớ đệm) ---------- */
const DB={db:null,mem:false,err:null,c:{},meta:{},
 async init(){
  STORES.forEach(s=>this.c[s]=[]);
  try{
   if(!window.indexedDB)throw new Error('Trình duyệt không hỗ trợ IndexedDB');
   this.db=await new Promise((res,rej)=>{
    const rq=indexedDB.open(APP_ID,DB_VERSION);
    rq.onupgradeneeded=()=>{const db=rq.result;STORES.forEach(s=>{if(!db.objectStoreNames.contains(s))db.createObjectStore(s,{keyPath:'id'})});if(!db.objectStoreNames.contains(HANDLE_STORE))db.createObjectStore(HANDLE_STORE,{keyPath:'id'})};
    rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error||new Error('Không mở được IndexedDB'));rq.onblocked=()=>rej(new Error('IndexedDB bị chặn'));
   });
   for(const s of STORES){const arr=await this._all(s);if(s==='meta')arr.forEach(m=>this.meta[m.id]=m.v);else this.c[s]=arr}
  }catch(e){this.mem=true;this.err=e;console.error(e)}
 },
 _all(s){return new Promise((res,rej)=>{const r=this.db.transaction(s).objectStore(s).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
 _tx(stores,fn){return new Promise((res,rej)=>{const tx=this.db.transaction(stores,'readwrite');try{fn(tx)}catch(e){try{tx.abort()}catch(_){}return rej(e)}tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error||new Error('Giao dịch bị hủy'))})},
 all(s){return this.c[s]},
 get(s,id){return id?this.c[s].find(r=>r.id===id):undefined},
 _up(s,rec){const a=this.c[s],i=a.findIndex(r=>r.id===rec.id);if(i>=0)a[i]=rec;else a.push(rec)},
 async _run(fn){if(this.mem){UI.saved();return}try{await fn();UI.saved();if(typeof JSYNC!=='undefined')JSYNC.schedule()}catch(e){console.error(e);UI.saved(true);toast('Lỗi lưu dữ liệu: '+(e&&e.message||e),'err')}},
 async put(s,rec){this._up(s,rec);await this._run(()=>this._tx(s,tx=>tx.objectStore(s).put(rec)));return rec},
 async putMany(s,recs){recs.forEach(r=>this._up(s,r));await this._run(()=>this._tx(s,tx=>{const o=tx.objectStore(s);recs.forEach(r=>o.put(r))}))},
 async del(s,id){this.c[s]=this.c[s].filter(r=>r.id!==id);await this._run(()=>this._tx(s,tx=>tx.objectStore(s).delete(id)))},
 async setMeta(k,v){this.meta[k]=v;await this._run(()=>this._tx('meta',tx=>tx.objectStore('meta').put({id:k,v})))},
 /* Thay thế toàn bộ trong MỘT giao dịch: lỗi thì dữ liệu cũ vẫn nguyên vẹn */
 async replaceAll(data){
  if(!this.mem)await this._tx(DATA_STORES,tx=>{DATA_STORES.forEach(s=>{const o=tx.objectStore(s);o.clear();(data[s]||[]).forEach(r=>o.put(r))})});
  DATA_STORES.forEach(s=>this.c[s]=(data[s]||[]).slice());UI.saved();
 },
 async mergeMany(map){
  const ss=Object.keys(map);
  if(!this.mem)await this._tx(ss,tx=>ss.forEach(s=>{const o=tx.objectStore(s);map[s].forEach(r=>o.put(r))}));
  ss.forEach(s=>map[s].forEach(r=>this._up(s,r)));UI.saved();
 },
 /* ----- File System Access API ----- */
 async getHandle(){
  if(this.mem||!this.db)return null;
  try{return await new Promise((res,rej)=>{const tx=this.db.transaction(HANDLE_STORE,'readonly');const rq=tx.objectStore(HANDLE_STORE).get('jsonSync');rq.onsuccess=()=>res(rq.result?rq.result.handle:null);rq.onerror=()=>rej(rq.error)})}
  catch(e){console.warn('getHandle:',e);return null}
 },
 async saveHandle(handle){
  if(this.mem||!this.db)return;
  try{await this._tx(HANDLE_STORE,tx=>tx.objectStore(HANDLE_STORE).put({id:'jsonSync',handle}))}
  catch(e){console.warn('saveHandle:',e)}
 },
 async clearHandle(){
  if(this.mem||!this.db)return;
  try{await this._tx(HANDLE_STORE,tx=>tx.objectStore(HANDLE_STORE).delete('jsonSync'))}
  catch(e){console.warn('clearHandle:',e)}
 }
};

/* ---------- JSON File Sync (File System Access API – Chrome/Edge) ---------- */
const JSYNC={
 handle:null,fileName:null,lastSync:null,status:'idle',_dt:null,
 sup(){return typeof window.showOpenFilePicker==='function'},
 _p(n){return String(n).padStart(2,'0')},
 _fmt(iso){if(!iso)return'—';const d=new Date(iso);return this._p(d.getHours())+':'+this._p(d.getMinutes())+':'+this._p(d.getSeconds())},
 ui(){
  const el=document.getElementById('syncInd');if(!el)return;
  if(!this.fileName||this.status==='idle'){el.textContent='';el.className='';el.title='Chưa kết nối file JSON sync';return}
  const map={ok:'💾 Sync '+this._fmt(this.lastSync),saving:'⏳ Đang lưu…',err:'⚠️ Lỗi sync',idle:''};
  el.className=this.status;el.textContent=map[this.status]||'';
  el.title='File JSON: '+this.fileName+(this.lastSync?'\nSync lần cuối: '+this._fmt(this.lastSync):'');
 },
 async connect(){
  if(!this.sup()){alert('Tính năng chỉ hoạt động trên Chrome/Edge.');return false}
  let hs;try{hs=await window.showOpenFilePicker({types:[{description:'JSON backup',accept:{'application/json':['.json']}}],multiple:false})}
  catch(e){if(e.name!=='AbortError')console.error(e);return false}
  const h=hs[0],perm=await h.requestPermission({mode:'readwrite'});
  if(perm!=='granted'){toast('Chưa được cấp quyền đọc/ghi file','warn');return false}
  this.handle=h;this.fileName=h.name;await DB.saveHandle(h);
  toast('Đã kết nối file '+h.name+'. Sẽ tự đồng bộ khi bạn thay đổi dữ liệu.');
  await this.read();this.status='ok';this.ui();
  if(typeof renderMain==='function')renderMain();return true;
 },
 async disconnect(){
  this.handle=null;this.fileName=null;this.lastSync=null;this.status='idle';
  await DB.clearHandle();this.ui();
  if(typeof renderMain==='function')renderMain();
  toast('Đã ngắt kết nối file JSON sync');
 },
 async read(){
  if(!this.handle)return;
  try{
   if(await this.handle.queryPermission({mode:'readwrite'})!=='granted')return;
   const txt=await(await this.handle.getFile()).text(),obj=JSON.parse(txt);
   const v=validateBackup(obj);if(!v.ok){console.warn('JSYNC read invalid:',v.errors);return}
   const map={};
   DATA_STORES.forEach(s=>{const a=obj.data[s];if(!Array.isArray(a)||!a.length)return;
    const ex=new Set(DB.all(s).map(r=>r.id));const nw=a.filter(r=>!ex.has(r.id));if(nw.length)map[s]=nw});
   if(Object.keys(map).length)await DB.mergeMany(map);
   this.lastSync=new Date().toISOString();this.status='ok';this.ui();
  }catch(e){console.error('JSYNC read err:',e);this.status='err';this.ui()}
 },
 schedule(){
  if(!this.handle)return;
  if(this._dt)clearTimeout(this._dt);
  this.status='saving';this.ui();
  this._dt=setTimeout(()=>this._write(),2000);
 },
 async _write(){
  if(!this.handle)return;
  try{
   if(await this.handle.queryPermission({mode:'readwrite'})!=='granted'){this.status='err';this.ui();return}
   const w=await this.handle.createWritable();
   await w.write(JSON.stringify(buildBackup('all'),null,2));await w.close();
   this.lastSync=new Date().toISOString();this.status='ok';this.ui();
  }catch(e){console.error('JSYNC write err:',e);this.status='err';this.ui();toast('Lỗi ghi file sync: '+e.message,'err')}
 },
 async restore(){
  if(!this.sup())return;
  const h=await DB.getHandle();if(!h)return;
  try{
   const perm=await h.queryPermission({mode:'readwrite'});
   if(perm==='granted'){this.handle=h;this.fileName=h.name;await this.read();this.status='ok';this.ui();toast('Đã tự đồng bộ từ file '+h.name)}
   else if(perm==='prompt'){this.handle=h;this.fileName=h.name;this.status='idle';this.ui()}
  }catch(e){console.warn('JSYNC restore err:',e)}
 }
};

const MODALS=[];
function openModal({title,body,footer='',size='',onSave,onClose,dismiss=false}){
  const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<div class="modal ${size}" role="dialog" aria-modal="true"><div class="mh"><h2>${esc(title)}</h2><button class="ibtn" data-act="modal-close" aria-label="Đóng">${ic('x')}</button></div><div class="mb2">${body}</div>${footer?`<div class="mf">${footer}</div>`:''}</div>`;
  $('#modals').appendChild(ov);const m={el:ov,onSave,onClose};MODALS.push(m);

function closeModal(m){m=m||MODALS[MODALS.length-1];if(!m)return;const i=MODALS.indexOf(m);if(i>=0)MODALS.splice(i,1);m.el.remove();if(m.onClose)m.onClose()}
function confirmBox({title='Xác nhận',msg,ok='Đồng ý',danger=false,must=null,html=false,cancel=true}){

     onSave(){if(must&&$('#'+id).value.trim()!==must){toast('Nội dung xác nhận chưa đúng','warn');return}done=true;closeModal(m);res(true)},

}

  await DB.put('journal',{id:uid(),periodId:P.id,ts:new Date().toISOString(),user:userName(),type,object:obj||'',content:content||'',result:result||'',note:'',auto:1,createdAt:new Date().toISOString()});
}

const VIEWS={};   /* route -> {render:()=>html, after?:()=>void} */
function go(route,opts){
  const k=route;
  if(opts&&ENT[k]){const st=UI._l(k);st.page=1;st.q='';st.flt={};st.rule=null;st.scope=opts.scope||null;
   Object.entries(opts).forEach(([a,b])=>{if(a==='rule')st.rule=b;else if(a==='scope')st.scope=b;else st.flt[a]=b})}
  if(location.hash==='#/'+k)renderMain();else location.hash='#/'+k;
}
function currentRoute(){return(location.hash.replace(/^#\//,'')||'dashboard').split('?')[0]}
function renderShell(){
  const P=curPeriod(),r=currentRoute();
  $('#nav').innerHTML=MENU.map(m=>m.top?`<a class="top ${r===m.r?'on':''}" href="#/${m.r}">${m.l}</a>`:
   `<div class="nav-g"><div class="gl">${ic(m.ic)} ${m.g}</div>${m.items.map(([k,l])=>`<a href="#/${k}" class="${r===k?'on':''}">${l}</a>`).join('')}</div>`).join('');
  const ps=periodsSorted().reverse();
  $('#topPeriod').innerHTML=P?`<b>Kỳ kiểm tra:</b><select id="periodSel" data-chg="setperiod" aria-label="Chọn kỳ kiểm tra">${ps.map(p=>`<option value="${p.id}" ${p.id===P.id?'selected':''}>${pLabel(p)} – ${esc(catName('periodStatus',p.status))}</option>`).join('')}</select>`:`<b>Chưa có kỳ kiểm tra</b>`;
  $('#userChip').textContent='Người kiểm tra: '+userName();
}
function renderMain(){
  const r=currentRoute();UI.key=r;renderShell();
  const main=$('#main');let v=VIEWS[r];
  if(!v&&ENT[r])v={render:()=>renderList(ENT[r])};
  if(!v){main.innerHTML=`<div class="empty"><b>Không tìm thấy màn hình</b>Chọn một mục ở menu bên trái.</div>`;return}
  try{main.innerHTML=(DB.mem?`<div class="banner r">${ic('alert')}<div>Không sử dụng được IndexedDB (${esc(DB.err&&DB.err.message||'lỗi')}). Dữ liệu chỉ tồn tại trong phiên làm việc này – hãy <b>Sao lưu</b> trước khi đóng trình duyệt.</div></div>`:'')+v.render();if(v.after)v.after()}

/* ===================== ENGINE CRUD DÙNG CHUNG ===================== */
const ENT={},RULES=[],ACT={},CHG={},INP={};
const F=(k,l,t,o)=>Object.assign({k,l,t},o||{});
const safe=fn=>{try{return fn()}catch(e){return false}};
function defEnt(d){
  d.singular=d.singular||d.title;d.fields=d.fields||[];
  d.label=d.label||(r=>r?String(r.code||r.name||r.id):'');
  ENT[d.key]=d;return d;
}
const fieldOf=(ent,k)=>ent.fields.find(f=>f.k===k);
const calcVal=(f,r)=>{try{return f.calc(r,ctx())}catch(e){return ''}};
const fieldVal=(f,r)=>f.t==='computed'?calcVal(f,r):r[f.k];
const fType=f=>f.t==='computed'?(f.fmt||'text'):f.t;
const YN={y:'Có',n:'Không',na:'N/A'};

function optsFor(f){
  if(f.opts)return f.opts;
  if(f.t==='cat'||(f.t==='computed'&&f.fmt==='cat'))return catItems(f.g).map(i=>[i.key,i.name]);
  if(f.t==='yn')return[['y','Có'],['n','Không'],['na','N/A']];
  if(f.t==='ref'){const e=ENT[f.ref];return DB.all(e.store).filter(x=>!f.where||f.where(x)).map(x=>[x.id,e.label(x)]).sort((a,b)=>a[1].localeCompare(b[1],'vi'))}
  return[];
}
function fmtVal(f,v){
  if(v==null||v==='')return'';
  const t=fType(f);
  switch(t){
   case'money':return fmtMoney(v);case'pct':return fmtPct(v);case'number':return fmtNum(v);case'days':return fmtNum(v)+' ngày';
   case'date':return fmtDate(v);case'month':return fmtMonth(v);case'datetime':return fmtDT(v);
   case'cat':return catName(f.g,v);
   case'ref':{const e=ENT[f.ref],r=DB.get(e.store,v);return r?e.label(r):'(đã xóa)'}
   case'yn':return YN[v]||v;
   case'select':{const o=optsFor(f).find(x=>x[0]===v);return o?o[1]:v}
   case'badge':return Array.isArray(v)?v[0]:(v.text||'');
   case'checkbox':return v==='y'?'Có':'Không';
   case'html':return String(v).replace(/<[^>]+>/g,'');
   default:return String(v);
  }
}
const isNumT=t=>['money','number','pct','days'].includes(t);
function exportVal(f,r){const v=fieldVal(f,r);return isNumT(fType(f))&&isNum(v)?Number(v):fmtVal(f,v)}
const ynTone=(f,v)=>(!v||v==='na')?'gray':((v==='y')===!f.bad?'green':'red');
const badge=(t,tone)=>`<span class="badge ${tone||''}">${esc(t)}</span>`;

function cellHtml(ent,f,r){
  const v=fieldVal(f,r),t=fType(f);
  if(f.inl&&f.t!=='computed'&&canMod(ent,r)){
    const cur=v==null?'':v,tone=f.t==='cat'?catTone(f.g,cur):'';
    return`<select class="inl" data-chg="inl" data-e="${ent.key}" data-id="${r.id}" data-k="${f.k}" aria-label="${esc(f.l)}"><option value=""></option>${optsFor(f).map(([a,b])=>`<option value="${esc(a)}" ${a===cur?'selected':''}>${esc(b)}</option>`).join('')}</select>`;
  }
  if(t==='html')return v==null?'':String(v);
  if(v==null||v==='')return f.dash?'<span class="note">—</span>':'';
  if(t==='cat')return badge(catName(f.g,v),catTone(f.g,v));
  if(t==='yn')return badge(YN[v]||v,ynTone(f,v));
  if(t==='badge')return Array.isArray(v)?badge(v[0],v[1]):badge(v.text,v.tone);
  const s=fmtVal(f,v);
  if(f.main)return`<span class="code" data-act="edit" data-e="${ent.key}" data-id="${r.id}">${esc(s)}</span>`;
  if(t==='ref')return`<span class="trunc" title="${esc(s)}">${esc(s)}</span>`;
  if(isNumT(t))return esc(s);
  if(t==='textarea'||s.length>60)return`<span class="trunc" title="${esc(s)}">${esc(s)}</span>`;
  return esc(s);
}
const alertsFor=(key,r)=>{const c=ctx();return RULES.filter(x=>x.ent===key&&safe(()=>x.test(r,c)))};
const alertPills=(key,r)=>{const a=alertsFor(key,r);if(!a.length)return'';return a.slice(0,2).map(x=>`<span class="alp ${x.tone}" title="${esc(x.label)}">${ic('alert')}${esc(x.short||x.label)}</span>`).join('')+(a.length>2?`<span class="alp b" title="${esc(a.slice(2).map(x=>x.label).join('; '))}">+${a.length-2}</span>`:'')};

/* ---------- Phạm vi & khóa kỳ ---------- */
function isLocked(ent,r){if(!ent.period||ent.lockable===false||!r)return false;const p=periodOf(r);return!!(p&&p.status==='done')}
const canMod=(ent,r)=>!isLocked(ent,r)&&(!ent.editable||ent.editable(r));
function scopedRows(ent){
  const st=UI._l(ent.key);let a=DB.all(ent.store);
  if(ent.period){const sc=st.scope||ent.defaultScope||'cur',P=curPeriod();
    if(sc==='cur')a=P?a.filter(r=>r.periodId===P.id):[];else if(sc!=='all')a=a.filter(r=>r.periodId===sc)}
  return a;
}
const rowText=(ent,r)=>ent.fields.filter(f=>f.t!=='info').map(f=>fmtVal(f,fieldVal(f,r))).join(' ');
function sortVal(f,r){if(f.sv)return f.sv(r);const v=fieldVal(f,r),t=fType(f);if(isNumT(t))return isNum(v)?Number(v):-Infinity;if(t==='date'||t==='month'||t==='datetime')return v||'';return norm(fmtVal(f,v))}
function filteredRows(ent){
  const st=UI._l(ent.key);let a=scopedRows(ent);
  for(const[k,val]of Object.entries(st.flt)){
    if(val===''||val==null)continue;const vf=(ent.vfilters||[]).find(x=>x.k===k);
    if(vf)a=a.filter(r=>vf.get(r)===val);else{const f=fieldOf(ent,k);a=a.filter(r=>{const x=f?fieldVal(f,r):r[k];return String(x==null?'':x)===val})}
  }
  if(st.rule)a=a.filter(r=>alertsFor(ent.key,r).some(x=>x.id===st.rule));
  if(st.q){const q=norm(st.q);a=a.filter(r=>norm(rowText(ent,r)).includes(q))}
  const so=st.sort||ent.sort;
  if(so){const f=fieldOf(ent,so.k);if(f){const d=so.dir==='desc'?-1:1;a=[...a].sort((x,y)=>{const p=sortVal(f,x),q=sortVal(f,y);return(p<q?-1:p>q?1:0)*d})}}
  return a;
}

/* ---------- Trang danh sách ---------- */
const noPeriodHtml=()=>`<div class="empty"><b>Chưa có kỳ kiểm tra</b>Hãy tạo kỳ kiểm tra để bắt đầu nhập dữ liệu.<br><a class="btn pri" href="#/newperiod">${ic('plus')} Tạo kỳ mới</a></div>`;
function filterBar(ent){
  const st=UI._l(ent.key),P=curPeriod();let h='<div class="fbar">';
  h+=`<div class="sb">${ic('search')}<input type="search" placeholder="Tìm kiếm (không cần gõ dấu)…" value="${esc(st.q)}" data-inp="q" data-e="${ent.key}" aria-label="Tìm kiếm"></div>`;
  if(ent.period){const sc=st.scope||ent.defaultScope||'cur';
    h+=`<select data-chg="flt" data-e="${ent.key}" data-k="@scope" aria-label="Phạm vi kỳ"><option value="cur" ${sc==='cur'?'selected':''}>Kỳ hiện tại (${pLabel(P)})</option><option value="all" ${sc==='all'?'selected':''}>Tất cả các kỳ</option>${periodsSorted().reverse().map(p=>`<option value="${p.id}" ${sc===p.id?'selected':''}>${pLabel(p)}</option>`).join('')}</select>`}
  ent.fields.filter(f=>f.f).forEach(f=>{const cur=st.flt[f.k]||'';
    h+=`<select data-chg="flt" data-e="${ent.key}" data-k="${f.k}" aria-label="${esc(f.l)}"><option value="">${esc(f.fl||f.l)}: tất cả</option>${optsFor(f).map(([a,b])=>`<option value="${esc(a)}" ${a===cur?'selected':''}>${esc(b)}</option>`).join('')}</select>`});
  (ent.vfilters||[]).forEach(vf=>{const cur=st.flt[vf.k]||'';
    h+=`<select data-chg="flt" data-e="${ent.key}" data-k="${vf.k}" aria-label="${esc(vf.l)}"><option value="">${esc(vf.l)}: tất cả</option>${vf.opts().map(([a,b])=>`<option value="${esc(a)}" ${a===cur?'selected':''}>${esc(b)}</option>`).join('')}</select>`});
  const rl=RULES.filter(x=>x.ent===ent.key);
  if(rl.length)h+=`<select data-chg="flt" data-e="${ent.key}" data-k="@rule" aria-label="Cảnh báo"><option value="">Cảnh báo: tất cả</option>${rl.map(x=>`<option value="${x.id}" ${st.rule===x.id?'selected':''}>${esc(x.label)}</option>`).join('')}</select>`;
  h+=`<button class="btn ghost sm" data-act="clrf" data-e="${ent.key}">${ic('refresh')} Đặt lại bộ lọc</button></div>`;
  return h;
}
function renderList(ent){
  const P=curPeriod();
  if(ent.period&&!P)return`<div class="ph"><div><h1>${ent.title}</h1></div></div>`+noPeriodHtml();
  const locked=ent.period&&ent.lockable!==false&&P&&P.status==='done';
  const canImport=ent.canAdd!==false&&!ent.addRoute;
  let h=`<div class="ph"><div><h1>${ent.title}</h1><p>${ent.desc||''}</p></div><div class="sp"></div><div class="acts">${ent.toolbar?ent.toolbar():''}<button class="btn" data-act="csv" data-e="${ent.key}">${ic('download')} Xuất CSV</button>${canImport?`<button class="btn" data-act="imp-open" data-e="${ent.key}">${ic('upload')} Nhập Excel</button>`:''}${ent.canAdd!==false?`<button class="btn pri" data-act="add" data-e="${ent.key}">${ic('plus')} ${ent.addLabel||'Thêm mới'}</button>`:''}</div></div>`;
  if(locked)h+=`<div class="banner y">${ic('lock')}<div>Kỳ ${pLabel(P)} đã hoàn thành – dữ liệu ở chế độ chỉ xem. Vào <b>Kỳ kiểm tra → Thông tin kỳ</b> để mở lại kỳ nếu cần chỉnh sửa.</div></div>`;
  if(ent.banner)h+=ent.banner();
  h+=filterBar(ent)+`<div id="lb">${listBody(ent)}</div>`;
  return h;
}
function refreshBody(key){const el=$('#lb');if(el)el.innerHTML=listBody(ENT[key])}
function listBody(ent){
  const st=UI._l(ent.key),all=scopedRows(ent),rows=filteredRows(ent);
  const size=st.size||S('pageSize'),pages=Math.max(1,Math.ceil(rows.length/size));if(st.page>pages)st.page=pages;
  const slice=rows.slice((st.page-1)*size,st.page*size);
  let h=ent.top?ent.top(rows,all):'';
  if(!rows.length){
    h+=all.length?`<div class="empty"><b>Không có kết quả phù hợp</b>Thử đổi từ khóa hoặc bỏ bớt bộ lọc.<br><button class="btn" data-act="clrf" data-e="${ent.key}">Đặt lại bộ lọc</button></div>`
     :`<div class="empty"><b>Chưa có ${ent.singular.toLowerCase()} nào</b>${ent.emptyText||'Bấm “Thêm mới” để bắt đầu nhập dữ liệu.'}${ent.canAdd!==false?`<br><button class="btn pri" data-act="add" data-e="${ent.key}">${ic('plus')} ${ent.addLabel||'Thêm mới'}</button>`:''}</div>`;
    return h;
  }
  const cols=ent.cols.map(k=>fieldOf(ent,k)).filter(Boolean),hasAl=RULES.some(x=>x.ent===ent.key);
  const so=st.sort||ent.sort||{};
  h+=`<div class="tw"><table class="t"><thead><tr>${cols.map(f=>`<th class="${isNumT(fType(f))?'num':''}" data-act="sort" data-e="${ent.key}" data-k="${f.k}" title="Bấm để sắp xếp">${esc(f.short||f.l)}${so.k===f.k?`<span class="ar">${so.dir==='desc'?'▼':'▲'}</span>`:''}</th>`).join('')}${hasAl?'<th class="ns">Cảnh báo tự động</th>':''}<th class="ns"></th></tr></thead><tbody>`;
  slice.forEach(r=>{
    const mod=canMod(ent,r),ra=(ent.rowActions||[]).filter(a=>!a.show||safe(()=>a.show(r)));
    h+=`<tr class="${mod?'':'lock'}">${cols.map(f=>`<td class="${isNumT(fType(f))?'num':''}">${cellHtml(ent,f,r)}</td>`).join('')}${hasAl?`<td>${alertPills(ent.key,r)}</td>`:''}<td class="tr">`+
     ra.map(a=>a.text?`<button class="btn sm" data-act="ra" data-e="${ent.key}" data-id="${r.id}" data-ra="${a.id}">${a.icon?ic(a.icon)+' ':''}${esc(a.label)}</button> `:`<button class="ibtn" title="${esc(a.label)}" data-act="ra" data-e="${ent.key}" data-id="${r.id}" data-ra="${a.id}">${ic(a.icon||'flag')}</button>`).join('')+
     `<button class="ibtn" title="${mod?'Sửa':'Xem chi tiết'}" data-act="edit" data-e="${ent.key}" data-id="${r.id}">${ic(mod?'edit':'eye')}</button>`+
     (mod&&ent.canDelete!==false?`<button class="ibtn del" title="Xóa" data-act="del" data-e="${ent.key}" data-id="${r.id}">${ic('trash')}</button>`:'')+`</td></tr>`;
  });
  h+=`</tbody></table></div>`;
  const pg=[];for(let i=1;i<=pages;i++){if(i===1||i===pages||Math.abs(i-st.page)<=1)pg.push(i);else if(pg[pg.length-1]!=='…')pg.push('…')}
  h+=`<div class="pager"><div>Hiển thị ${(st.page-1)*size+1}–${Math.min(rows.length,st.page*size)} / ${rows.length} bản ghi${rows.length!==all.length?` (lọc từ ${all.length})`:''}</div><div class="pg">${pages>1?pg.map(p=>p==='…'?'<span>…</span>':`<button class="btn sm ${p===st.page?'on':''}" data-act="page" data-e="${ent.key}" data-p="${p}">${p}</button>`).join(''):''}</div>
   <div>Số dòng/trang <select data-chg="psize" data-e="${ent.key}" style="width:auto;min-height:28px;padding:2px 6px">${[10,15,25,50,100].map(n=>`<option ${n===size?'selected':''}>${n}</option>`).join('')}</select></div></div>`;
  return h;
}

/* ---------- Xuất dữ liệu ---------- */
const csvCell=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
function toCSV(head,rows){return'\ufeff'+[head,...rows].map(r=>r.map(csvCell).join(',')).join('\r\n')}
function csvOfEntity(ent,rows){const fs=ent.fields.filter(f=>f.t!=='info');return toCSV(fs.map(f=>f.l),rows.map(r=>fs.map(f=>exportVal(f,r))))}
const xmlEsc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function xlsXml(sheets){
  return`<?xml version="1.0" encoding="UTF-8"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Styles><Style ss:ID="h"><Font ss:Bold="1"/><Interior ss:Color="#DDE6EA" ss:Pattern="Solid"/></Style></Styles>`+
  sheets.map(sh=>`<Worksheet ss:Name="${xmlEsc(sh.name.replace(/[\\\/?*\[\]:]/g,' ').slice(0,31))}"><Table>`+[sh.head,...sh.rows].map((row,i)=>`<Row>`+row.map(c=>{const n=typeof c==='number'&&isFinite(c);return`<Cell${i===0?' ss:StyleID="h"':''}><Data ss:Type="${n?'Number':'String'}">${xmlEsc(c==null?'':c)}</Data></Cell>`}).join('')+`</Row>`).join('')+`</Table></Worksheet>`).join('')+`</Workbook>`;
}
const fileTag=()=>{const P=curPeriod();return(P?`Q${P.quarter}-${P.year}`:'')+'_'+stamp().slice(0,10)};

/* ---------- Form nhập liệu ---------- */
function inputHtml(f,val){
  const n=`name="${f.k}" id="f_${f.k}"`,v=val==null?'':val,ph=f.ph?`placeholder="${esc(f.ph)}"`:'';
  switch(f.t){
   case'textarea':return`<textarea ${n} rows="${f.rows||3}" ${ph}>${esc(v)}</textarea>`;
   case'number':case'money':case'pct':return`<input type="number" step="any" ${f.min!=null?`min="${f.min}"`:''} ${f.max!=null?`max="${f.max}"`:''} ${n} value="${esc(v)}" ${ph}>`;
   case'date':return`<input type="date" ${n} value="${esc(v)}">`;
   case'month':return`<input type="month" ${n} value="${esc(v)}">`;
   case'datetime':return`<input type="datetime-local" ${n} value="${esc(String(v).length>16?nowLocalFromIso(v):v)}">`;
   case'cat':case'select':case'yn':case'ref':{
     let o=optsFor(f);if(v!==''&&!o.some(x=>x[0]===v))o=[...o,[v,String(v)+' (không còn trong danh mục)']];
     return`<select ${n}><option value="">${f.t==='yn'?'— Chưa xác định —':'— Chọn —'}</option>${o.map(([a,b])=>`<option value="${esc(a)}" ${a===v?'selected':''}>${esc(b)}</option>`).join('')}</select>`}
   case'auto':return`<input type="text" ${n} value="${esc(v)}" placeholder="Tự động tạo khi lưu" readonly>`;
   case'checkbox':return`<label style="display:flex;align-items:center;gap:8px;font-weight:400;cursor:pointer"><input type="checkbox" ${n} ${v==='y'?'checked':''} style="width:16px;height:16px"><span>${esc(f.checkText||'Có')}</span></label>`;
   case'computed':return`<div class="calc" data-calc="${f.k}"></div>`;
   case'info':return`<div class="info" data-info="${f.k}"></div>`;

function nowLocalFromIso(s){const d=new Date(s);return isNaN(d)?'':d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes())}
function fieldWrap(f,val){

  return`<div class="fld ${full?'full':''}" data-fld="${f.k}">${showLbl?`<label for="f_${f.k}">${esc(f.l)}${f.req?'<span class="rq" title="Bắt buộc">*</span>':''}</label>`:''}${inputHtml(f,val)}${f.help?`<div class="hp">${esc(f.help)}</div>`:''}<div class="em"></div></div>`;

function formHtml(ent,base){

  if(tabs.length>1)h+=`<div class="tabs" role="tablist">${tabs.map((t,i)=>`<button type="button" data-act="tab" data-i="${i}" class="${i===0?'on':''}">${esc(t)}</button>`).join('')}</div>`;
  tabs.forEach((t,i)=>{h+=`<div class="tp ${i===0?'on':''}" data-tp="${i}"><div class="fgrid">`;
    ent.fields.filter(f=>(f.tab||0)===i&&!f.noForm).forEach(f=>{if(f.sec)h+=`<div class="secl">${esc(f.sec)}</div>`;h+=fieldWrap(f,base[f.k])});
    h+='</div></div>'});

function defaultsFor(ent,preset){
  const c=ctx(),o={};ent.fields.forEach(f=>{if(f.def!==undefined)o[f.k]=typeof f.def==='function'?f.def(c):f.def});
  return Object.assign(o,ent.defaults?ent.defaults(c):{},preset||{});

function readForm(ent,form){
  const v={};
  ent.fields.forEach(f=>{
    if(['computed','info','auto'].includes(f.t)||f.noForm)return;
    const el=form.elements[f.k];if(!el)return;
    v[f.k]=f.t==='checkbox'?(el.checked?'y':''):(f.t==='number'||f.t==='money'||f.t==='pct')?(el.value===''?'':parseFloat(el.value)):(f.t==='datetime'&&el.value?new Date(el.value).toISOString():el.value.trim?el.value.trim():el.value);
    if(f.t==='datetime'&&!el.value)v[f.k]='';
  });
  return v;
}
function refreshForm(m,changed){
  const{ent,base}=m.ctx,form=m.el.querySelector('form');if(!form)return;
  let v=readForm(ent,form);
  const hook=changed&&ent.onChange&&ent.onChange[changed];
  if(hook){const fills=hook({...base,...v},ctx())||{};Object.entries(fills).forEach(([k,val])=>{const el=form.elements[k];if(el&&val!=null&&val!==''){el.value=val;v[k]=(el.type==='number')?parseFloat(val):val}})}
  const full={...base,...v};
  ent.fields.forEach(f=>{
    if(f.t==='computed'){const el=form.querySelector(`[data-calc="${f.k}"]`);if(el)el.innerHTML=cellHtml(ent,{...f,inl:false,main:false},full)||'<span class="note">—</span>'}
    else if(f.t==='info'){const el=form.querySelector(`[data-info="${f.k}"]`);if(el)el.innerHTML=safe(()=>f.html(full))||'<span class="note">Chưa có dữ liệu liên quan</span>'}
  });
  const al=alertsFor(ent.key,full),box=form.querySelector('#frmAl');
  if(box)box.innerHTML=al.length?`<div class="banner y" style="flex-wrap:wrap"><b>Cảnh báo tự động (KTKS xem xét, chưa phải kết luận):</b> ${al.map(x=>`<span class="alp ${x.tone}">${esc(x.label)}</span>`).join(' ')}</div>`:'';
}
function validateForm(ent,v,id,base){
  const errs={};
  ent.fields.forEach(f=>{
    if(['computed','info','auto'].includes(f.t)||f.noForm)return;const x=v[f.k];
    if(f.req&&(x===''||x==null))errs[f.k]='Bắt buộc nhập';
    else if(['number','money','pct'].includes(f.t)&&x!==''){
      if(typeof x!=='number'||isNaN(x))errs[f.k]='Phải là số hợp lệ';
      else if(f.min!=null&&x<f.min)errs[f.k]=`Không được nhỏ hơn ${f.min}`;else if(f.max!=null&&x>f.max)errs[f.k]=`Không được lớn hơn ${f.max}`}
    if(f.unique&&x&&!errs[f.k]&&DB.all(ent.store).some(r=>r.id!==id&&String(r[f.k]||'').trim().toLowerCase()===String(x).trim().toLowerCase()))errs[f.k]=`${f.l} đã tồn tại`;
  });
  if(ent.validate)Object.assign(errs,ent.validate(v,ctx(),base)||{});
  return errs;
}
function showErrors(m,errs){
  const form=m.el.querySelector('form');$$('.fld.err',form).forEach(e=>{e.classList.remove('err');e.querySelector('.em').textContent=''});
  $$('.tabs button',form).forEach(b=>b.classList.remove('has-err'));
  let first=null;
  Object.entries(errs).forEach(([k,msg])=>{const w=form.querySelector(`[data-fld="${k}"]`);if(!w)return;w.classList.add('err');w.querySelector('.em').textContent=msg;
    const tp=w.closest('.tp');if(tp){const b=form.querySelector(`.tabs button[data-i="${tp.dataset.tp}"]`);if(b)b.classList.add('has-err');if(!first)first=w}});
  if(first){const tp=first.closest('.tp');ACT.tab({dataset:{i:tp.dataset.tp},closest:()=>m.el});const inp=first.querySelector('input,select,textarea');if(inp)inp.focus()}
}
function diffText(ent,old,rec){
  const ch=[];ent.fields.forEach(f=>{if(['computed','info','auto','textarea'].includes(f.t)||f.noForm)return;
    if(String(old[f.k]==null?'':old[f.k])!==String(rec[f.k]==null?'':rec[f.k]))ch.push(`${f.l}: ${fmtVal(f,old[f.k])||'∅'} → ${fmtVal(f,rec[f.k])||'∅'}`)});
  return ch.length?' | '+ch.slice(0,4).join('; ')+(ch.length>4?` (+${ch.length-4} trường)`:''):'';
}
async function commit(ent,rec,old){
  const isNew=!old;
  if(ent.beforeSave)ent.beforeSave(rec,isNew,old);
  rec.updatedAt=new Date().toISOString();
  await DB.put(ent.store,rec);
  if(ent.log!==false)await logAct(isNew?'Tạo mới':'Cập nhật',ent.singular,`${isNew?'Tạo':'Cập nhật'} ${ent.singular.toLowerCase()} ${ent.label(rec)}${isNew?'':diffText(ent,old,rec)}`,'',rec.periodId);
  if(ent.afterSave)await ent.afterSave(rec,isNew,old);
  return rec;
}
function openForm(key,id,preset,readOnly){
  const ent=ENT[key],rec=id?DB.get(ent.store,id):null,P=curPeriod();
  if(id&&!rec)return;
  if(!id&&ent.period){
    if(!P){toast('Chưa có kỳ kiểm tra. Hãy tạo kỳ mới trước.','warn');return}
    if(ent.lockable!==false&&P.status==='done'){toast(`Kỳ ${pLabel(P)} đã hoàn thành – không thể thêm. Hãy mở lại kỳ.`,'warn');return}
  }
  const ro=!!readOnly||(rec&&!canMod(ent,rec)),base=rec?{...rec}:defaultsFor(ent,preset);
  const m=openModal({title:`${ro?'Chi tiết':rec?'Sửa':'Thêm mới'} – ${ent.singular}`,size:ent.size||'',body:formHtml(ent,base),
   footer:ro?`<button class="btn" data-act="modal-close">Đóng</button>`:`<button class="btn" data-act="modal-close">Hủy</button><button class="btn pri" data-act="modal-save">${ic('check')} Lưu</button>`,
   onSave:()=>saveForm(m)});
  m.ctx={ent,id,base,ro};
  const form=m.el.querySelector('form');
  refreshForm(m);
  if(ro)$$('input,select,textarea',form).forEach(e=>e.disabled=true);
  else{const f1=form.querySelector('input:not([readonly]),select,textarea');if(f1)f1.focus()}
  return m;
}
async function saveForm(m){
  const{ent,id,base}=m.ctx,form=m.el.querySelector('form'),v=readForm(ent,form),errs=validateForm(ent,v,id,base);
  if(Object.keys(errs).length){showErrors(m,errs);toast('Vui lòng kiểm tra lại các trường báo đỏ','warn');return}
  const old=id?DB.get(ent.store,id):null;
  const rec=old?{...old,...v}:{...base,...v,id:uid(),createdAt:new Date().toISOString()};
  if(!old&&ent.period&&!rec.periodId)rec.periodId=curPeriod().id;
  try{await commit(ent,rec,old)}catch(e){console.error(e);toast('Không lưu được: '+e.message,'err');return}
  closeModal(m);toast(old?'Đã cập nhật '+ent.singular.toLowerCase():'Đã thêm '+ent.singular.toLowerCase(),'');
  if(m.after)m.after(rec);
  renderMain();
}

function collectCascade(key,id,list=[]){
  Object.values(ENT).forEach(E=>E.fields.forEach(f=>{if(f.t==='ref'&&f.ref===key&&f.cascade)DB.all(E.store).filter(x=>x[f.k]===id).forEach(x=>{list.push([E.key,x.id]);collectCascade(E.key,x.id,list)})}));
  return list;
}
async function unlinkSoft(key,id){
  for(const E of Object.values(ENT))for(const f of E.fields)if(f.t==='ref'&&f.ref===key&&f.soft)
    for(const x of DB.all(E.store).filter(x=>x[f.k]===id))await DB.put(E.store,{...x,[f.k]:''});
}
async function deleteRecord(key,id,opts={}){
  const ent=ENT[key],r=DB.get(ent.store,id);if(!r)return;
  const casc=collectCascade(key,id);
  for(const[k,i]of casc.reverse()){await unlinkSoft(k,i);await DB.del(ENT[k].store,i)}
  await unlinkSoft(key,id);await DB.del(ent.store,id);
  if(!opts.silent&&ent.log!==false)await logAct('Xóa',ent.singular,`Xóa ${ent.singular.toLowerCase()} ${ent.label(r)}`+(casc.length?` (kèm ${casc.length} bản ghi liên quan)`:''),'',r.periodId);
}
async function askDelete(key,id){
  const ent=ENT[key],r=DB.get(ent.store,id);if(!r)return;
  if(isLocked(ent,r)){toast('Kỳ đã hoàn thành – không thể xóa','warn');return}
  const used=[];Object.values(ENT).forEach(E=>E.fields.forEach(f=>{if(f.t==='ref'&&f.ref===key&&!f.soft&&!f.cascade){const n=DB.all(E.store).filter(x=>x[f.k]===id).length;if(n)used.push(`${E.title} (${n})`)}}));
  if(used.length){await infoBox('Không thể xóa',`<b>${esc(ent.label(r))}</b> đang được sử dụng ở: ${esc(used.join(', '))}.<br>Hãy xóa hoặc chuyển các bản ghi đó trước.`);return}
  const casc=collectCascade(key,id),cnt={};casc.forEach(([k])=>cnt[ENT[k].title]=(cnt[ENT[k].title]||0)+1);
  const ok=await confirmBox({title:'Xác nhận xóa',danger:true,ok:'Xóa',html:true,msg:`Bạn có chắc muốn xóa <b>${esc(ent.label(r))}</b>?`+(casc.length?`<br><br>Sẽ xóa kèm: ${Object.entries(cnt).map(([a,b])=>`${esc(a)} (${b})`).join(', ')}.`:'')+`<br><span class="note">Thao tác không thể hoàn tác (hãy sao lưu nếu cần).</span>`});
  if(!ok)return;
  await deleteRecord(key,id);toast('Đã xóa','');renderMain();
}

function ctrDurationMonths(c){
  if(!c)return null;if(c.indefinite==='y')return 999;
  const a=c.effDate||c.signDate,b=c.endDate;if(!a||!b)return null;
  const d1=new Date(a),d2=new Date(b);if(isNaN(d1)||isNaN(d2))return null;
  return Math.max(0,(d2.getFullYear()-d1.getFullYear())*12+(d2.getMonth()-d1.getMonth())+(d2.getDate()>=d1.getDate()?0:-1)+1);
}
function daysInFirstMonth(effDate){
  if(!effDate)return null;
  const d=new Date(effDate);
  if(isNaN(d))return null;
  const lastDay=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
  return lastDay-d.getDate()+1;
}
function firstMonthRule(c){
  if(!c||!c.effDate)return'';
  const days=daysInFirstMonth(c.effDate);
  if(days==null)return'';
  if(days<20)return`Tháng đầu có ${days} ngày (< 20 ngày) ➔ Theo Khoản 6 QĐ 11, tính CK theo DOANH THU LƯU KHO THÁNG KẾ TIẾP`;
  return`Tháng đầu có ${days} ngày (≥ 20 ngày) ➔ Tính CK theo DOANH THU LƯU KHO THÁNG ĐẦU TIÊN`;
}

function custContractHistory(customerId){
  if(!customerId)return{years:0,months:0,count:0,firstDate:'',isGe3Years:false,contracts:[]};
  const cts=DB.all('contracts').filter(c=>c.customerId===customerId&&(c.effDate||c.signDate));
  if(!cts.length)return{years:0,months:0,count:0,firstDate:'',isGe3Years:false,contracts:[]};
  const sorted=cts.slice().sort((a,b)=>(a.effDate||a.signDate).localeCompare(b.effDate||b.signDate));
  const firstDate=sorted[0].effDate||sorted[0].signDate;
  const d1=new Date(firstDate),now=new Date();
  const months=Math.max(0,(now.getFullYear()-d1.getFullYear())*12+(now.getMonth()-d1.getMonth()));
  const years=+(months/12).toFixed(1);
  return{years,months,count:cts.length,firstDate,isGe3Years:months>=35,contracts:sorted};
}
function qd176Tier(months){
  if(months==null||months===''||N(months)<6)return{tier:'lt6',label:'Dưới 6 tháng',rate:0,valid:false};
  const m=N(months);
  if(m<=12)return{tier:'6to12',label:'Từ 6 đến 12 tháng',rate:10,valid:true};
  if(m<=35)return{tier:'13to35',label:'Từ 13 đến 35 tháng',rate:20,valid:true};
  return{tier:'ge36',label:'Từ 36 tháng trở lên',rate:30,valid:true};
}
function calcQd176Clawback(actualRate,oneMonthRent,actualMonths){
  if(!isNum(actualRate)||!isNum(oneMonthRent)||!isNum(actualMonths))return 0;
  const earnedTier=qd176Tier(actualMonths);
  const diffRate=Math.max(0,N(actualRate)-earnedTier.rate);
  return Math.round(N(oneMonthRent)*diffRate/100);
}

const policyServicesFor=id=>id?DB.all('policyservices').filter(x=>x.policyId===id):[];
function matchPolicyService(psvs,unit,per){
  if(!psvs||!psvs.length)return null;
  const u=norm(unit||''), p=(per||'month').toLowerCase();
  const exact=psvs.find(s=>{
    const su=norm(s.unit||''), sp=(s.per||'').toLowerCase(), sn=norm(s.service||'');
    const uMatch=su===u||sn.includes(u)||(u==='m3'&&sn.includes('m³'))||(u==='m³'&&sn.includes('m3'));
    const pMatch=sp===p||(p==='day'&&sn.includes('ngay'))||(p==='month'&&sn.includes('thang'));
    return uMatch&&pMatch;
  });
  if(exact)return exact;
  return psvs.find(s=>{
    const su=norm(s.unit||''), sn=norm(s.service||'');
    return su===u||sn.includes(u)||(u==='m3'&&sn.includes('m³'))||(u==='m³'&&sn.includes('m3'));
  })||null;
}

function volTierOf(policyId,unit,qty){
  const f=VOL_UNIT_FIELDS[unit]||(['m3','tan','pallet','m2'].includes(unit)?unit:null);if(!f||!isNum(qty))return'';
  const row=policyVolTiersFor(policyId).find(t=>isNum(t[f+'Min'])&&N(qty)>=N(t[f+'Min'])&&(!isNum(t[f+'Max'])||N(qty)<N(t[f+'Max'])));

}

function suggestDiscRate(v){
  const c=ctr(v.contractId);if(!c)return null;
  if(v.termCase==='renew_qd176'||v.termCase==='extension'){
    const dm=isNum(v.renewMonths)?N(v.renewMonths):ctrDurationMonths(c);
    const tier=qd176Tier(dm);
    return isNum(tier.rate)?tier.rate:null;
  }
  const p=sitePolicyFor(c.site,c.effDate||todayStr());if(!p||!v.type)return null;
  if(ctrModel(c)==='storage'){
    if(!isNum(v.volQty)||!v.volUnit)return null;
    const tier=volTierOf(p.id,v.volUnit,v.volQty);if(!tier)return null;
    const dm=ctrDurationMonths(c),dur=durationBucket(dm);if(!dur)return null;
    const a=ckAllowedForStorage(p.id,dur,tier,v.type);
    return isNum(a)?a:null;
  }
  const a=ckAllowedFor(p.id,ctrPrice(c),v.type);
  return isNum(a)?a:null;
}

    sorted.forEach(t=>{h+=line(`Giá bán <b>${esc(fmtMoney(t.priceLevel))} đ</b> – ${esc(catName('discType',t.object))}: tối đa <b>${esc(fmtNum(t.maxCkPct))}%</b>`,btn('Sửa',`data-e="policytiers" data-id="${t.id}"`))});
  }
  h+=`<div style="margin-top:8px">${btn('+ Thêm bậc chiết khấu',`data-e="policytiers" data-c="${id}"`)}</div>`;

}
function policyServicesHtml(v){
  const id=v.id;if(!id)return'';
  if((v.policyType||'lease')!=='storage')return`<div class="ih">Bảng giá dịch vụ</div><div class="note">Chỉ dùng cho chính sách <b>Lưu kho trọn gói</b>. Đổi "Loại chính sách" ở tab Thông tin chung để dùng mục này.</div>`;
  const rows=policyServicesFor(id);
  const btn=(t,a)=>`<button type="button" class="btn sm" data-act="policy-line" ${a}>${t}</button>`;
  const line=(l,edit)=>`<div style="display:flex;gap:8px;align-items:center;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--line2)"><span>${l}</span>${edit}</div>`;
  let h=`<div class="ih">Bảng giá dịch vụ (theo sản lượng)</div>`;
  if(!rows.length)h+=`<div class="note">Chưa có dòng giá dịch vụ nào – VD: Kho thường theo m³/tháng, Nâng hạ bốc xếp theo lượt...</div>`;
  rows.forEach(r=>{h+=line(`<b>${esc(r.service)}</b> (${esc(r.unit)}${r.per&&r.per!=='month'?'/'+(LINE_PER.find(x=>x[0]===r.per)||['',r.per])[1]:'/tháng'}): Min ${esc(fmtMoney(r.priceMin))} – BQ ${esc(fmtMoney(r.priceAvg))} – Max <b>${esc(fmtMoney(r.priceMax))}</b> đ`,btn('Sửa',`data-e="policyservices" data-id="${r.id}"`))});
  h+=`<div style="margin-top:8px;margin-bottom:14px">${btn('+ Thêm dòng giá dịch vụ',`data-e="policyservices" data-c="${id}"`)}</div>`;
  return h;
}
function policyVolTiersHtml(v){
  const id=v.id;if(!id)return'';
  if((v.policyType||'lease')!=='storage')return'';
  const rows=policyVolTiersFor(id).sort((a,b)=>N(a.tierNo)-N(b.tierNo));
  const btn=(t,a)=>`<button type="button" class="btn sm" data-act="policy-line" ${a}>${t}</button>`;
  const line=(l,edit)=>`<div style="display:flex;gap:8px;align-items:center;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--line2)"><span>${l}</span>${edit}</div>`;
  const rng=(a,b)=>isNum(a)||isNum(b)?`${isNum(a)?fmtNum(a):'0'}–${isNum(b)?fmtNum(b):'∞'}`:'';
  let h=`<div class="ih">Bậc sản lượng (quy đổi theo từng đơn vị)</div>`;
  if(!rows.length)h+=`<div class="note">Chưa có bậc sản lượng nào – cần đủ Bậc 1/2/3 để hệ thống xác định mức chiết khấu.</div>`;
  rows.forEach(r=>{const parts=[];if(isNum(r.m3Min)||isNum(r.m3Max))parts.push('m³: '+rng(r.m3Min,r.m3Max));if(isNum(r.tanMin)||isNum(r.tanMax))parts.push('tấn: '+rng(r.tanMin,r.tanMax));if(isNum(r.palletMin)||isNum(r.palletMax))parts.push('pallet: '+rng(r.palletMin,r.palletMax));if(isNum(r.m2Min)||isNum(r.m2Max))parts.push('m²: '+rng(r.m2Min,r.m2Max));
    h+=line(`<b>${esc(volTierName(r.tierNo))}</b> – ${esc(parts.join(' · ')||'(chưa nhập khoảng)')}`,btn('Sửa',`data-e="policyvoltiers" data-id="${r.id}"`))});
  h+=`<div style="margin-top:8px">${btn('+ Thêm bậc sản lượng',`data-e="policyvoltiers" data-c="${id}"`)}</div>`;
  return h;
}

defEnt({key:'prices',title:'Giá & Báo giá',singular:'Kiểm tra giá',store:'prices',period:true,
 desc:'So sánh giá chính sách – báo khách – thương lượng – hợp đồng – thị trường; tự tính % chênh lệch.',label:r=>'Kiểm tra giá '+ctrNo(r.contractId),
 tabs:['Đối chiếu giá','Phê duyệt & nhận xét'],
 fields:[ctrRef({tab:0}),ctrInfo,F('cust','Khách hàng','computed',{noForm:1,calc:r=>ctrCust(ctr(r.contractId))}),
  F('policyRef','Chính sách áp dụng','computed',{fmt:'text',noForm:1,tab:0,calc:r=>{const c=ctr(r.contractId),p=c&&sitePolicyFor(c.site,c.effDate||todayStr());return p?policyName(p.id):'(chưa có chính sách phù hợp cho kho này)'}}),
  F('policyPrice','Giá chính sách/niêm yết (VND)','money',{tab:0,min:0,help:'Tự lấy theo Chính sách giá của kho khi chọn hợp đồng, có thể sửa tay'}),F('quotedPrice','Giá báo khách (VND)','money',{tab:0,min:0}),F('negoPrice','Giá thương lượng (VND)','money',{tab:0,min:0}),
  F('contractPrice','Giá hợp đồng (VND)','money',{tab:0,min:0}),F('marketPrice','Giá thị trường tham chiếu (VND)','money',{tab:0,min:0}),F('marketSource','Nguồn tham chiếu','text',{tab:0}),
  F('diffPolicy','% chênh lệch so với giá chính sách','computed',{fmt:'pct',tab:0,calc:r=>priceDiff(r.contractPrice,r.policyPrice)}),
  F('diffMarket','% chênh lệch so với thị trường','computed',{fmt:'pct',tab:0,calc:r=>priceDiff(r.contractPrice,r.marketPrice)}),
  areaOf('reason','Lý do giảm giá',{tab:1}),F('exception','Có phê duyệt ngoại lệ?','yn',{tab:1}),person('approver','Người phê duyệt',{tab:1}),areaOf('note','Nhận xét KTKS',{tab:1})],
 cols:['contractId','cust','policyPrice','quotedPrice','negoPrice','contractPrice','marketPrice','diffPolicy','exception'],sort:{k:'contractId',dir:'asc'},
 onChange:{contractId:v=>{const c=ctr(v.contractId);if(!c)return null;const o={};if(!isNum(v.contractPrice)&&isNum(ctrPrice(c)))o.contractPrice=ctrPrice(c);const p=sitePolicyFor(c.site,c.effDate||todayStr());if(!isNum(v.policyPrice)&&p){if(ctrModel(c)==='storage'){const r=ctrRentals(c.id).find(x=>x.kind==='luukho'&&isNum(x.unitPrice));const m=r&&matchPolicyService(policyServicesFor(p.id),r.unit,r.per);if(m&&isNum(m.priceMin))o.policyPrice=m.priceMin;else if(isNum(p.basePrice))o.policyPrice=r&&r.per==='day'?Math.round(p.basePrice/30):p.basePrice}else if(isNum(p.basePrice)){o.policyPrice=p.basePrice}}return Object.keys(o).length?o:null}},
 validate:uniqPerPeriod('prices','contractId','Hợp đồng này đã có bản ghi kiểm tra giá trong kỳ')});

defEnt({key:'renewals',title:'Tái tục hợp đồng',singular:'Theo dõi tái tục',store:'renewals',period:true,

  <b>Lưu ý KTKS Tái tục (QĐ 176/2024/QĐ-HNT):</b> Hợp đồng đã ký từ <b>3 năm trở lên</b> tiếp tục gia hạn hoặc tái ký được hưởng chính sách chiết khấu cho Phòng Dự án (10% cho 6–12 tháng; 20% cho 13–35 tháng; 30% cho ≥ 36 tháng, tính trên 1 tháng doanh thu thuê kho bãi). Yêu cầu đề xuất của GĐĐH và HĐQT thông qua.
 </div>`,

 tabs:['Hợp đồng & tiến độ','Giá tái tục'],
 fields:[ctrRef({tab:0}),ctrInfo,F('endDate','Ngày hết hạn','computed',{fmt:'date',tab:0,sv:r=>(ctr(r.contractId)||{}).endDate||'',calc:r=>(ctr(r.contractId)||{}).endDate}),
  F('left','Số ngày còn lại','computed',{fmt:'badge',tab:0,sv:r=>{const d=daysLeft(ctr(r.contractId));return d==null?9e9:d},calc:r=>{const d=daysLeft(ctr(r.contractId));return d==null?'':d<0?[`Quá ${-d} ngày`,'red']:[d+' ngày',d<=30?'red':d<=90?'yellow':'gray']}}),
  F('bucket','Nhóm thời hạn','computed',{fmt:'select',opts:BUCKETS.map(x=>[x[0],x[1]]),f:1,tab:0,calc:renewBucket}),
  F('qd176Eligible','Điều kiện CK QĐ 176','computed',{fmt:'badge',tab:0,calc:r=>{const c=ctr(r.contractId);if(!c)return'';const hist=custContractHistory(c.customerId);return(hist.isGe3Years||(isNum(c.priorYears)&&N(c.priorYears)>=3))?['Đủ ĐK ≥ 3 năm (QĐ 176)','green']:['Chưa đủ 3 năm','gray']}}),
  F('startNego','Ngày bắt đầu đàm phán','date',{tab:0}),person('owner','Người phụ trách',{tab:0,f:1}),
  F('status','Trạng thái','cat',{g:'renewStatus',def:'notstart',req:1,f:1,inl:1,tab:0}),areaOf('reason','Lý do chưa hoàn thành',{tab:0,rows:2}),
  F('curPrice','Giá hiện tại (VND)','money',{tab:1,min:0}),F('upRate','Tỷ lệ tăng giá quy định (%)','pct',{tab:1,min:0}),
  F('expPrice','Giá dự kiến sau tăng (VND)','computed',{fmt:'money',tab:1,calc:r=>isNum(r.curPrice)?Math.round(N(r.curPrice)*(1+N(r.upRate)/100)):''}),
  F('actPrice','Giá tái tục thực tế (VND)','money',{tab:1,min:0}),F('newSign','Ngày ký HĐ/phụ lục mới','date',{tab:1}),areaOf('note','Ghi chú / nhận xét KTKS',{tab:1})],
 cols:['contractId','endDate','left','qd176Eligible','owner','curPrice','upRate','expPrice','actPrice','status'],sort:{k:'left',dir:'asc'},
 onChange:{contractId:v=>{const c=ctr(v.contractId);if(!c)return null;const o={};if(!isNum(v.curPrice)&&isNum(ctrPrice(c)))o.curPrice=ctrPrice(c);if(!isNum(v.upRate)&&isNum(c.upRate))o.upRate=c.upRate;return o}},
 validate:uniqPerPeriod('renewals','contractId','Hợp đồng này đã có bản ghi tái tục trong kỳ')});

const qtrOf=m=>m?`${m.slice(0,4)}-Q${Math.ceil(+m.slice(5,7)/3)}`:'';
defEnt({key:'revenues',title:'Doanh thu & Công nợ',singular:'Doanh thu/công nợ tháng',store:'revenues',
 desc:'Theo từng hợp đồng và tháng. Còn nợ, số ngày quá hạn và nợ quá hạn được tính tự động theo ngày hiện tại.',label:r=>`${ctrNo(r.contractId)} – ${fmtMonth(r.month)}`,
 top:rows=>{const debt=sumBy(rows,r=>Math.max(0,revBal(r))),ov=sumBy(rows,r=>revCalc(r).ov);
  return`<div class="sumline"><div>Tổng doanh thu<b>${fmtMoney(sumBy(rows,r=>r.revenue))}</b></div><div>Tổng phải thu<b>${fmtMoney(sumBy(rows,r=>r.receivable))}</b></div><div>Tổng đã thu<b>${fmtMoney(sumBy(rows,r=>r.collected))}</b></div><div>Công nợ<b>${fmtMoney(debt)}</b></div><div>Nợ trong hạn<b>${fmtMoney(debt-ov)}</b></div><div>Nợ quá hạn<b class="r">${fmtMoney(ov)}</b></div></div>`},
 vfilters:[{k:'qtr',l:'Quý',get:r=>qtrOf(r.month),opts:()=>[...new Set(DB.all('revenues').map(r=>qtrOf(r.month)).filter(Boolean))].sort().reverse().map(x=>[x,'Q'+x.slice(6)+'/'+x.slice(0,4)])}],
 fields:[ctrRef(),ctrInfo,F('month','Tháng','month',{req:1}),F('revenue','Doanh thu (VND)','money',{min:0}),F('receivable','Phải thu (VND)','money',{min:0}),F('invoiced','Đã xuất hóa đơn (VND)','money',{min:0}),F('collected','Đã thu (VND)','money',{min:0}),
  F('balance','Còn nợ (VND)','computed',{fmt:'money',calc:r=>revBal(r)}),F('dueDate','Hạn thanh toán','date'),F('payDate','Ngày thanh toán','date'),
  F('od','Số ngày quá hạn','computed',{fmt:'badge',sv:r=>revCalc(r).od,calc:r=>{const o=revCalc(r).od;return o>0?[o+' ngày',revCalc(r).ov>0?'red':'yellow']:['0','gray']}}),areaOf('note','Ghi chú')],
 cols:['contractId','month','revenue','receivable','invoiced','collected','balance','dueDate','payDate','od'],sort:{k:'month',dir:'desc'},
 onChange:{contractId:v=>{const c=ctr(v.contractId);if(!c)return null;const o={};const mo=ctrMonthly(c);if(!isNum(v.receivable)&&isNum(mo))o.receivable=mo;if(!isNum(v.revenue)&&isNum(mo))o.revenue=mo;return o},
  month:v=>{const c=ctr(v.contractId);return c&&v.month&&!v.dueDate&&isNum(c.payDueDays)?{dueDate:addDays(v.month+'-01',N(c.payDueDays))}:null}},
 validate:v=>isNum(v.collected)&&isNum(v.receivable)&&v.collected>v.receivable?{collected:'Đã thu lớn hơn phải thu – kiểm tra lại'}:{}});

defEnt({key:'discounts',title:'Chiết khấu',singular:'Chiết khấu',store:'discounts',period:true,
 banner:()=>`<div class="banner b" style="font-size:12.5px;display:block">
  <b>Chính sách chiết khấu hiện hành:</b><br>
  • <b>QĐ 11/2025/QĐ-HNT (Lưu kho trọn gói):</b> Doanh thu ≥ 5 tr/tháng; Bậc CK theo thời hạn &amp; sản lượng; Ký tháng đầu &lt; 20 ngày tính doanh thu tháng kế tiếp; HĐ ≤ 3 tháng do GĐĐH duyệt trả vào lương.<br>
  • <b>QĐ 176/2024/QĐ-HNT (Gia hạn HĐ Phòng Dự án):</b> Áp dụng cho HĐ đã ký từ 3 năm trở lên; Chiết khấu 1 lần trên 1 tháng doanh thu thuê kho bãi; Mức tối đa: <b>6–12 tháng (10%)</b>, <b>13–35 tháng (20%)</b>, <b>≥ 36 tháng (30%)</b>; GĐĐH đề xuất + HĐQT thông qua; Khách chủ động chấm dứt trước hạn: truy thu về mức thời hạn thực tế.
 </div>`,
 desc:'Kiểm tra chiết khấu/hoa hồng theo chính sách: tỷ lệ được phép, tỷ lệ thực tế, phê duyệt và chứng từ.',label:r=>'Chiết khấu '+ctrNo(r.contractId),
 tabs:['Chiết khấu','Phê duyệt & kiểm tra'],
 fields:[ctrRef({tab:0}),ctrInfo,F('cust','Khách hàng','computed',{noForm:1,calc:r=>ctrCust(ctr(r.contractId))}),
  F('termCase','Trường hợp thời hạn & chấm dứt HĐ','select',{opts:[
    ['normal','Bình thường (HĐ mới)'],
    ['renew_qd176','Khách gia hạn HĐ - Phòng Dự án (QĐ 176/2024/QĐ-HNT)'],
    ['extension','Khách gia hạn HĐ (chung)'],
    ['early_client','Khách chủ động chấm dứt trước hạn (phải truy thu CK)'],
    ['early_hnt','HNT chủ động thỏa thuận chấm dứt (giữ nguyên CK)'],
    ['short','HĐ ≤ 3 tháng (GĐĐH duyệt trả thưởng vào lương)']
  ],def:'normal',tab:0,help:'Theo Khoản 7 QĐ 11 & QĐ 176/2024/QĐ-HNT'}),
  F('related','Doanh thu liên quan (VND)','money',{tab:0,min:0,help:'Theo QĐ 176: Là doanh thu thuê kho bãi 1 tháng của HĐ/phụ lục gia hạn'}),
  F('receiver','Đối tượng nhận (tên cụ thể)','text',{tab:0}),
  F('type','Loại (đối tượng hưởng CK)','cat',{g:'discType',f:1,tab:0,help:'Dùng để đối chiếu đúng bậc chiết khấu Phòng Dự án/Môi giới trong Chính sách giá'}),
  F('isPrior3Years','Khách hàng đã ký HĐ từ ≥ 3 năm trở lên (QĐ 176)?','select',{opts:[
    ['auto','Tự động nhận diện từ hệ thống (≥ 3 năm)'],
    ['yes_manual','Xác nhận thủ công từ hồ sơ ngoài hệ thống (≥ 3 năm)'],
    ['no','Không / Chưa đủ 3 năm']
  ],def:'no',tab:0,help:'Điều kiện tiên quyết QĐ 176: Áp dụng cho hợp đồng đã ký từ 3 năm trở lên'}),
  F('priorProof','Căn cứ thâm niên / Số HĐ cũ (nếu xác nhận thủ công)','text',{tab:0,ph:'VD: HĐ số 12/2021/HĐTK-HNT ký ngày 15/05/2021',help:'Bắt buộc khi chọn Xác nhận thủ công từ hồ sơ ngoài hệ thống'}),
  F('renewMonths','Thời hạn gia hạn HĐ (tháng)','number',{tab:0,min:0,help:'Khung tối đa QĐ 176: 6–12 tháng (10%), 13–35 tháng (20%), ≥ 36 tháng (30%)'}),
  F('oneMonthRentBase','Doanh thu thuê kho bãi 1 tháng (chuẩn)','money',{tab:0,min:0,help:'Theo QĐ 176: Căn cứ tính chiết khấu là doanh thu thuê kho bãi 1 tháng của HĐ/phụ lục gia hạn'}),
  F('qd176RuleNote','Kiểm tra chính sách gia hạn QĐ 176','computed',{tab:0,full:1,calc:r=>{
    if(r.termCase!=='renew_qd176'&&r.termCase!=='extension')return'';
    const c=ctr(r.contractId);const hist=c?custContractHistory(c.customerId):null;
    const dm=isNum(r.renewMonths)?N(r.renewMonths):(c?ctrDurationMonths(c):null);
    const tier=qd176Tier(dm);
    let s=`<b>QĐ 176/2024/QĐ-HNT:</b> Thời hạn gia hạn: <b>${dm!=null?dm+' tháng':'Chưa xác định'}</b> ➔ Khung CK tối đa: <b>${tier.rate}%</b> (${tier.label}).`;
    if(hist&&hist.count>0){
      s+=`<br>Lịch sử hệ thống: Khách hàng có <b>${hist.count}</b> HĐ từ <b>${fmtDate(hist.firstDate)}</b> (~${hist.years} năm) ➔ ${hist.isGe3Years?'<span class="g">Đủ điều kiện ≥ 3 năm</span>':'<span class="r">Chưa đủ 3 năm trên hệ thống</span>'}.`;
    }
    return s;
  }}),
  F('volQty','Sản lượng lưu kho trong kỳ tính CK','number',{tab:0,min:0,help:'Chỉ nhập khi hợp đồng là Lưu kho trọn gói – dùng để xác định Bậc sản lượng'}),
  F('volUnit','Đơn vị sản lượng','select',{opts:[['m³','m³'],['tấn','tấn'],['pallet','pallet'],['m²','m²']],tab:0}),
  F('firstMonthDays','Số ngày tháng đầu ký HĐ','computed',{tab:0,sv:r=>{const c=ctr(r.contractId);return c&&c.effDate?daysInFirstMonth(c.effDate):''},calc:r=>{const c=ctr(r.contractId);const d=c&&c.effDate?daysInFirstMonth(c.effDate):null;return d!=null?d+' ngày':''}}),
  F('firstMonthApplied','Tính CK trên doanh thu tháng đầu tiên?','select',{opts:[['y','Có (tháng đầu ≥ 20 ngày)'],['n','Không (tính trên doanh thu tháng kế tiếp do tháng đầu < 20 ngày)']],def:'y',tab:0,help:'Theo Khoản 6 QĐ 11: Nếu KH ký HĐ tháng đầu dưới 20 ngày thì mức hưởng tính dựa trên doanh số lưu kho tháng kế tiếp'}),
  F('firstMonthRuleNote','Quy tắc tính tháng đầu (QĐ 11)','computed',{tab:0,full:1,calc:r=>{const c=ctr(r.contractId);return c&&ctrModel(c)==='storage'?firstMonthRule(c):''}}),
  F('policyRef','Chính sách áp dụng','computed',{fmt:'text',noForm:1,tab:0,calc:r=>{
    if(r.termCase==='renew_qd176'||r.termCase==='extension')return'QĐ số 176/2024/QĐ-HNT (Gia hạn HĐ Phòng Dự án)';
    const c=ctr(r.contractId),p=c&&sitePolicyFor(c.site,c.effDate||todayStr());return p?policyName(p.id):'(chưa có chính sách phù hợp cho kho này)';

 cols:['contractId','cust','type','termCase','related','allowedRate','actualRate','amount','over','exception'],sort:{k:'contractId',dir:'asc'},
 onChange:{related:v=>isNum(v.related)&&isNum(v.actualRate)?{amount:Math.round(v.related*v.actualRate/100)}:null,
  actualRate:v=>{
    const o={};
    if(isNum(v.related)&&isNum(v.actualRate))o.amount=Math.round(v.related*v.actualRate/100);
    if((v.termCase==='renew_qd176'||v.termCase==='extension'||v.earlyTermBy==='client')&&isNum(v.actualMonthsUsed)){
      const rent=isNum(v.oneMonthRentBase)?N(v.oneMonthRentBase):(isNum(v.related)?N(v.related):0);

    }
    return Object.keys(o).length?o:null;
  },
  actualMonthsUsed:v=>{
    if(!isNum(v.actualMonthsUsed))return null;
    const rent=isNum(v.oneMonthRentBase)?N(v.oneMonthRentBase):(isNum(v.related)?N(v.related):0);
    return {clawbackAmt:calcQd176Clawback(v.actualRate,rent,v.actualMonthsUsed)};
  },
  contractId:v=>{
    const c=ctr(v.contractId);if(!c)return null;
    const o={};
    const hist=custContractHistory(c.customerId);
    if(hist.isGe3Years||(isNum(c.priorYears)&&N(c.priorYears)>=3))o.isPrior3Years='auto';
    const dm=ctrDurationMonths(c);
    if(dm!=null)o.renewMonths=dm;
    const mo=ctrMonthly(c);
    if(isNum(mo)&&N(mo)>0)o.oneMonthRentBase=mo;
    if(v.termCase==='renew_qd176'||v.termCase==='extension'){
      if(isNum(mo)&&N(mo)>0&&(!isNum(v.related)||N(v.related)===0))o.related=mo;
      const tier=qd176Tier(dm);
      o.allowedRate=tier.rate;
      o.type=catKeyByName('discType','Phòng Dự án')||v.type;
      if(isNum(o.related)&&isNum(v.actualRate))o.amount=Math.round(o.related*v.actualRate/100);
    }else{
      const a=suggestDiscRate(v);
      if(a!=null)o.allowedRate=a;
    }
    return Object.keys(o).length?o:null;
  },
  termCase:v=>{
    const c=ctr(v.contractId);const o={};
    if(v.termCase==='renew_qd176'||v.termCase==='extension'){
      o.type=catKeyByName('discType','Phòng Dự án')||v.type;
      if(c){
        const hist=custContractHistory(c.customerId);
        if(hist.isGe3Years||(isNum(c.priorYears)&&N(c.priorYears)>=3))o.isPrior3Years='auto';
        const dm=ctrDurationMonths(c);
        if(dm!=null)o.renewMonths=dm;
        const mo=ctrMonthly(c);
        if(isNum(mo)&&N(mo)>0){
          o.oneMonthRentBase=mo;
          if(!isNum(v.related)||N(v.related)===0)o.related=mo;
        }
        const tier=qd176Tier(dm);
        o.allowedRate=tier.rate;
        const rel=o.related||v.related;
        if(isNum(rel)&&isNum(v.actualRate))o.amount=Math.round(rel*v.actualRate/100);
      }
    }
    return Object.keys(o).length?o:null;
  },
  renewMonths:v=>{

 },
 validate:(v,c,b)=>{

     if(isNum(v.related)&&N(v.related)<5000000&&isNum(v.amount)&&N(v.amount)>0&&v.exception!=='y')
       e.related='Doanh thu lưu kho dưới 5.000.000 đ – không đủ điều kiện hưởng chiết khấu (Điều 2 QĐ 11)';
     if(v.termCase==='early_client'&&(!isNum(v.clawbackAmt)||N(v.clawbackAmt)<=0)&&v.exception!=='y')
       e.clawbackAmt='Khách chủ động chấm dứt trước hạn: Phải nhập số tiền chiết khấu truy thu (Khoản 7 QĐ 11)';
   }
   if(v.termCase==='renew_qd176'||v.termCase==='extension'){
     if(v.isPrior3Years==='no'&&v.exception!=='y')
       e.isPrior3Years='Khách hàng chưa đủ điều kiện đã ký từ 3 năm trở lên theo QĐ 176/2024/QĐ-HNT';
     if(v.isPrior3Years==='yes_manual'&&!v.priorProof&&v.exception!=='y')
       e.priorProof='Xác nhận thủ công ≥ 3 năm: Bắt buộc nhập căn cứ số HĐ cũ hoặc ngày ký gốc';
     if(isNum(v.renewMonths)&&N(v.renewMonths)<6&&isNum(v.amount)&&N(v.amount)>0&&v.exception!=='y')
       e.renewMonths='HĐ gia hạn dưới 6 tháng không thuộc khung hưởng chiết khấu theo QĐ 176';
     if(v.earlyTermBy==='client'||v.termCase==='early_client'){
       const rent=isNum(v.oneMonthRentBase)?N(v.oneMonthRentBase):(isNum(v.related)?N(v.related):0);

       if((!isNum(v.clawbackAmt)||N(v.clawbackAmt)<req)&&v.exception!=='y')
         e.clawbackAmt=`Khách chủ động chấm dứt trước hạn: Cần truy thu tối thiểu ${fmtMoney(req)} đ (về mức thực tế ${v.actualMonthsUsed||0} tháng)`;
     }
   }
   return e;
 }});


/* ---------- Chia hoa hồng doanh thu khách hàng mới (Sale & Môi giới) ---------- */
/* Chính sách: chỉ trả hoa hồng 1 lần cho kỳ đầu tiên (mặc định) = 1 tháng dương lịch kể từ
   ngày bắt đầu hợp đồng/ngày khách bắt đầu phát sinh doanh thu. VD bắt đầu 15/8 → kỳ 1 = 15/8–14/9.
   Số kỳ được hưởng có thể chỉnh ở Quản lý danh mục → Tham số (mặc định = 1). */
function addMonths(dateStr,n){if(!dateStr)return'';const[y,m,dd]=dateStr.split('-').map(Number);return isoDate(new Date(y,m-1+n,dd))}
function commRange(r){if(!r.periodStart)return null;const n=Math.max(1,parseInt(r.periodNo,10)||1);return[addMonths(r.periodStart,n-1),addDays(addMonths(r.periodStart,n),-1)]}
const commRangeLabel=r=>{const rg=commRange(r);return rg?`${fmtDate(rg[0])} – ${fmtDate(rg[1])}`:''};
const commExtra=r=>(parseInt(r.periodNo,10)||1)>S('commPeriods');
const commTotal=r=>{const s1=isNum(r.revenue)&&isNum(r.saleActualRate)?Math.round(N(r.revenue)*N(r.saleActualRate)/100):0;const b1=r.hasBroker==='y'&&isNum(r.revenue)&&isNum(r.brokerActualRate)?Math.round(N(r.revenue)*N(r.brokerActualRate)/100):0;return s1+b1};

function remState(f){
  const rs=DB.all('recs').filter(x=>x.findingId===f.id);
  if(!rs.length)return['Chưa có kiến nghị','gray','none',0];
  if(rs.every(x=>x.status==='closed'))return['Đã khắc phục','green','done',3];
  if(rs.some(x=>recEff(x)==='overdue'))return['Quá hạn','red','over',1];
  return['Đang khắc phục','yellow','doing',2];
}

Rl('ct_no_policy','contracts','Kho/dự án của hợp đồng chưa có Chính sách giá nào áp dụng','Chưa có chính sách giá','y',c=>!!c.id&&c.status==='active'&&!sitePolicyFor(c.site,c.effDate||todayStr()),{dash:1});
Rl('ct_below_policy','contracts','Giá thuê/lưu kho trong hợp đồng thấp hơn giá bán chuẩn theo Chính sách giá','Giá dưới chính sách','y',c=>{
  if(!c.id||c.status!=='active')return false;
  const p=sitePolicyFor(c.site,c.effDate||todayStr());if(!p)return false;
  if(ctrModel(c)==='storage'){
    const rs=ctrRentals(c.id).filter(r=>r.kind==='luukho'&&isNum(r.unitPrice)&&N(r.unitPrice)>0);if(!rs.length)return false;
    const psvs=policyServicesFor(p.id);
    for(const r of rs){
      const match=matchPolicyService(psvs,r.unit,r.per);
      const minP=match&&isNum(match.priceMin)?match.priceMin:(r.per==='day'&&isNum(p.basePrice)?Math.round(N(p.basePrice)/30):p.basePrice);
      if(isNum(minP)&&N(minP)>0&&N(r.unitPrice)<N(minP))return true;
    }
    return false;
  }
  if(!isNum(p.basePrice))return false;
  const price=ctrPrice(c);
  return isNum(price)&&N(price)>0&&N(price)<N(p.basePrice);
},{dash:1});
